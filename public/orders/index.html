  .dm button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 11px 14px; border-radius: 8px; font-weight: 600; }
  .dm button:hover { background: #f3f2ed; } .dm .danger { color: #b3261e; }
  .ec .combo input, .ec input { padding: 8px; font-size: 16px; }
  .tgs { display: inline; margin-left: 6px; }
  .tg { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; border-radius: 5px; padding: 2px 6px; margin-right: 4px; vertical-align: middle; text-decoration: none; }
  .tg-add { background: #dcefe1; color: #14532d; } .tg-ed { background: #fde9b8; color: #6b4b00; } .tg-rem { background: #f7d9d6; color: #8a1c14; } .tg-mv { background: #dbe6f2; color: #1f3d66; }
  .was { font-size: 12px; color: #888; margin-left: 2px; }
  .wrow.dim .nmx { color: #999; text-decoration: line-through; }
  .addrow { padding: 12px 0 0; } .addrow input { border-style: dashed; }
  .pkbox { margin: 0 0 8px 14px; border-left: 3px solid #e0a800; background: #fffaeb; padding: 8px 12px; }
  .pkt { font-size: 13px; font-weight: 700; color: #7a5a00; margin-bottom: 6px; }
  .pkr { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .pkr .pq { width: 80px; text-align: right; flex: none; } .pkr .ph { flex: 1; }
  .pkf { display: flex; gap: 12px; align-items: center; }
  .rtog { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; margin: 0 0 8px; cursor: pointer; }
  .rtog input { width: 18px; height: 18px; }
  .wpk { background: #fffaeb; border-left: 3px solid #e0a800; padding: 8px 12px; margin: 0 0 8px; }
  .wpkt { font-size: 12px; font-weight: 700; color: #7a5a00; margin-bottom: 4px; }
  .wpkr { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; font-size: 15px; }
  .wpq { width: 90px; text-align: center; font-size: 17px; font-weight: 700; padding: 7px 6px; border: 1.5px solid #ccc; border-radius: 10px; flex: none; }
  .wrs { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #f4f6f9; padding: 8px 12px; margin: 0 0 8px; font-size: 15px; }
  .wrv { width: 110px; text-align: right; font-size: 17px; font-weight: 700; padding: 7px 8px; border: 1.5px solid #ccc; border-radius: 10px; }
  .mleft { background: #f4f6f9; border-radius: 10px; padding: 12px 14px; margin-top: 14px; display: grid; gap: 8px; }
  .rad { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0; flex-wrap: wrap; }
  .rad input[type=radio] { width: auto; } .rad input[type=date] { width: auto; padding: 6px 8px; }
  .mf { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  .mbtn.ghost { background: #f0efea; color: #333; } .mbtn.go { background: #1f7a3a; color: #fff; min-width: 140px; }
  @media (max-width: 560px) { .wrow { grid-template-columns: 1fr 80px 64px 34px; } .wrow > .wo { display: none; } .wrow.wh span:nth-child(2) { display: none; } .mbox { padding: 18px 16px; } }
  #login { max-width: 380px; margin: 60px auto; }

</style>
</head>
<body>
<header class="hide" id="top">
  <h1>Em H Orders</h1>
  <nav id="nav"></nav>
  <div class="who"><span id="me"></span><a href="#" id="pw">Password</a><a href="#" id="signout">Sign out</a></div>
</header>

<main>
  <div id="login" class="card hide">
    <h2>Sign in</h2>
    <label>Username</label><input id="li-email" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label>Password</label><input id="li-pass" type="password" autocomplete="current-password">
    <div class="actions"><button class="big" id="li-go">Sign in</button></div>
    <p class="muted">No login yet? Ask an admin to add you under Staff.</p>
  </div>
  <div id="view"></div>
</main>

<script>
const sb = supabase.createClient('https://bcdibbhmiwccvvmryqze.supabase.co', 'sb_publishable_YAtej3hTvSDPHPLQVYk-Ig_K4rxgiYr',
  { auth: { storageKey: 'emh-orders-auth', persistSession: true, autoRefreshToken: true } });

/* ================= basics ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null || n === '' || isNaN(n) ? '—' : '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qf = n => n == null || n === '' ? '' : String(Number(n));
const U = u => u === 'kg' ? 'kg' : u === 'units' ? 'units' : '';
const per = u => u === 'kg' ? 'kg' : 'unit';
const ukDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const isoDay = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return d.toLocaleDateString('en-CA'); };
const isNum = v => v !== '' && v != null && !isNaN(Number(v));
const ST = { new: 'To prepare', fulfilled: 'Ready to invoice', invoiced: 'Invoiced' };

let customers = [], items = [], me = '', role = '';
const STAFF_DOMAIN = '@staff.emhbutchers.co.uk';
const uname = e => (e || '').endsWith(STAFF_DOMAIN) ? e.slice(0, -STAFF_DOMAIN.length) : (e || '');
const cust = id => customers.find(c => c.id == id);
const item = id => items.find(i => i.id == id);

function toast(text, err) {
  document.querySelectorAll('.msg').forEach(m => m.remove());
  const el = document.createElement('div'); el.className = 'msg' + (err ? ' err' : ''); el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), err ? 6000 : 2200);
}
async function q(p) {
  const { data, error } = await p;
  if (error) { let m = error.message || String(error); if (/row-level security/i.test(m)) m = 'Your login is not allowed to do that.'; throw new Error(m); }
  return data;
}
async function safe(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }
async function loadLists() {
  [customers, items] = await Promise.all([
    q(sb.from('ord_customers').select('*').order('name')),
    q(sb.from('ord_items').select('*').order('name')),
  ]);
}
async function pricesFor(lineIds) {
  const out = {};
  if (role === 'processing') return out;
  for (let i = 0; i < lineIds.length; i += 150) {
    const rows = await q(sb.from('ord_line_prices').select('*').in('line_id', lineIds.slice(i, i + 150)));
    rows.forEach(r => out[r.line_id] = r.price);
  }
  return out;
}

/* ================= type-to-search box ================= */
function combo(el, o) {
  el.classList.add('combo');
  el.innerHTML = `<input autocomplete="off" placeholder="${esc(o.placeholder || 'Type to search…')}"><div class="opts hide"></div>`;
  const inp = el.querySelector('input'), box = el.querySelector('.opts');
  const nameOf = id => (o.list().find(r => r.id == id) || {}).name || '';
  inp.value = nameOf(o.value);
  let shown = [], hi = 0;
  function draw() {
    const t = inp.value.trim().toLowerCase(), words = t.split(/\s+/).filter(Boolean);
    shown = o.list().filter(r => r.active !== false && words.every(w => r.name.toLowerCase().includes(w))).slice(0, 40).map(r => ({ id: r.id, label: r.name }));
    if (o.onAdd && t && !o.list().some(r => r.name.toLowerCase() === t)) shown.push({ add: inp.value.trim(), label: `+ Add “${inp.value.trim()}” as a new ${o.addWord}` });
    hi = Math.min(hi, Math.max(0, shown.length - 1));
    box.innerHTML = shown.length ? shown.map((s, i) => `<div class="opt ${s.add != null ? 'add' : ''} ${i === hi ? 'hi' : ''}" data-i="${i}">${esc(s.label)}</div>`).join('') : `<div class="opt muted">Nothing found${o.addWord === 'item' ? ' – add it in Xero, then Sync in Settings' : ''}</div>`;
    box.classList.remove('hide');
  }
  async function pick(s) {
    if (!s) return;
    box.classList.add('hide');
    if (s.add != null) { const row = await safe(() => o.onAdd(s.add)); if (!row) return; o.value = row.id; inp.value = o.clear ? '' : row.name; o.onPick(row.id); }
    else { o.value = s.id; inp.value = o.clear ? '' : s.label; o.onPick(s.id); }
  }
  inp.onfocus = () => { inp.select(); hi = 0; draw(); };
  inp.oninput = () => { hi = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); const s = shown[hi]; inp.blur(); pick(s); }
    else if (e.key === 'Escape') inp.blur();
  };
  inp.onblur = () => setTimeout(() => { box.classList.add('hide'); inp.value = o.clear ? '' : nameOf(o.value); }, 180);
  box.onmousedown = e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); const s = shown[+d.dataset.i]; inp.blur(); pick(s); } };
  return { focus: () => inp.focus() };

let O = null;
async function packingFor(lineIds) {
  const out = {};
  for (let i = 0; i < lineIds.length; i += 150) {
    (await q(sb.from('ord_packing').select('*').in('line_id', lineIds.slice(i, i + 150)).order('position'))).forEach(r => (out[r.line_id] ||= []).push(r));
  }
  return out;
}
async function resaleFor(lineIds) {
  const out = {};
  if (role === 'invoicing') return out;
  for (let i = 0; i < lineIds.length; i += 150) (await q(sb.from('ord_line_resale').select('*').in('line_id', lineIds.slice(i, i + 150)))).forEach(r => out[r.line_id] = r.total);
  return out;
}

function saveOrder() {

let TRAY = 1.65;

async function openWeigh(o) {

    if (ed) t.push('<span class="tg tg-ed">edited</span>');
    if (l.mode === 'deleted') t.push('<span class="tg tg-rem">removed</span>');
    const orig = l.orig_item_id || (l.newItem != l.item_id ? l.item_id : null);
    if (orig && orig != l.newItem && l.item_id) t.push(`<span class="was">was ${esc(item(orig)?.name)}</span>`);
    return t.join('');
  };
  const { m, close } = modal(`
    <div class="mh"><div><div class="mt">${esc(cust(o.customer_id)?.name)}</div><div class="ms">Order #${o.id} · delivery ${ukDate(o.delivery_date)}</div></div>
      <button class="mx" title="Close">✕</button></div>
    ${o.notes ? `<div class="mnote">${esc(o.notes)}</div>` : ''}
    <label class="rtog"><input type="checkbox" data-rs ${resaleOn ? 'checked' : ''}> Resale prices</label>
    <div class="wl"></div>
    <div class="addrow"><div class="ac"></div></div>
    <div class="mf"><button class="mbtn ghost" data-c>Cancel</button><button class="mbtn go" data-d>Done</button></div>`);
  const wl = m.querySelector('.wl');
  function draw(focusIx) {
    wl.innerHTML = `<div class="wrow wh"><span>Item</span><span>Ordered</span><span>Sent kg</span><span>Trays</span><span></span></div>` +
      lines.map((l, ix) => {
        let right;
        if (l.mode === 'deleted') right = `<span class="wstate"><button class="lk" data-undo="${ix}">undo</button></span>`;
        else if (l.mode === 'later') right = `<span class="wstate">New order <input type="date" class="ld" data-ld="${ix}" value="${esc(l.ld)}"> <button class="lk" data-undo="${ix}">undo</button></span>`;
        else right = `<span><input class="wi" data-ix="${ix}" inputmode="decimal" value="${esc(l.w)}"></span><span><select class="ws" data-ix="${ix}">${opts(l.t)}</select></span>`;
        return `<div class="wrow ${l.mode === 'deleted' || l.mode === 'later' ? 'dim' : ''}">
          <span class="wn">${l.mode === 'edit' ? `<span class="ec" data-ec="${ix}"></span>` : `<span class="nmx">${esc(item(l.newItem)?.name)}</span>`}<span class="tgs" data-tg="${ix}">${liveTags(l)}</span></span>
          <span class="wo">${l.added_by_ops ? '—' : `${qf(l.qty_ordered)} ${U(l.unit)}`}</span>
          ${right}
          <span class="dots"><button class="db" data-m="${ix}">⋯</button>
            <div class="dm hide" data-dm="${ix}">
              <button data-a="edit" data-ix="${ix}">Edit item</button>
              ${l.added_by_ops ? '' : `<button data-a="later" data-ix="${ix}">Create new order</button>`}
              <button data-a="del" data-ix="${ix}" class="danger">Delete</button>
            </div></span>
        </div>
        ${l.mode ? '' : `${(l.pack || []).length ? `<div class="wpk"><div class="wpkt">Packing – how many packed?</div>${l.pack.map((r, j) => `<div class="wpkr"><span>${r.planned != null ? qf(r.planned) + ' × ' : ''}${esc(r.how)}</span><input class="wpq nav" data-ix="${ix}" data-j="${j}" inputmode="decimal" placeholder="Packed" value="${esc(r.packed)}"></div>`).join('')}</div>` : ''}
          ${resaleOn ? `<div class="wrs"><span>Resale price, total for this item</span><span>£ <input class="wrv nav" data-ix="${ix}" inputmode="decimal" value="${esc(l.rv)}"></span></div>` : ''}`}`;
      }).join('');
    const ins = [...wl.querySelectorAll('.wi, .nav')];
    ins.forEach((i, k) => i.onkeydown = e => { if (e.key === 'Enter') { ins[k + 1] ? ins[k + 1].focus() : i.blur(); } });
    wl.querySelectorAll('.wi').forEach(i => i.oninput = () => { const l = lines[i.dataset.ix]; l.w = i.value.trim(); wl.querySelector(`[data-tg="${i.dataset.ix}"]`).innerHTML = liveTags(l); });
    wl.querySelectorAll('.wpq').forEach(i => i.oninput = () => lines[i.dataset.ix].pack[i.dataset.j].packed = i.value.trim());
    wl.querySelectorAll('.wrv').forEach(i => i.oninput = () => lines[i.dataset.ix].rv = i.value.trim());
    wl.querySelectorAll('.ws').forEach(s => s.onchange = () => { const l = lines[s.dataset.ix]; l.t = s.value; wl.querySelector(`[data-tg="${s.dataset.ix}"]`).innerHTML = liveTags(l); });
    wl.querySelectorAll('[data-m]').forEach(b => b.onclick = e => {
      e.stopPropagation(); const dm = wl.querySelector(`[data-dm="${b.dataset.m}"]`), was = !dm.classList.contains('hide');
      wl.querySelectorAll('.dm').forEach(x => x.classList.add('hide')); if (!was) dm.classList.remove('hide');
    });
    wl.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const ix = +b.dataset.ix, l = lines[ix];
      if (b.dataset.a === 'del') { if (!l.id) { lines.splice(ix, 1); return draw(); } l.mode = 'deleted'; }
      if (b.dataset.a === 'later') { l.mode = 'later'; l.ld = l.ld || isoDay(1); }
      if (b.dataset.a === 'edit') l.mode = 'edit';
      draw();
      if (b.dataset.a === 'edit') wl.querySelector(`[data-ec="${ix}"] input`)?.focus();
    });
    wl.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { lines[b.dataset.undo].mode = null; draw(); });
    wl.querySelectorAll('[data-ld]').forEach(i => i.oninput = () => lines[i.dataset.ld].ld = i.value);
    wl.querySelectorAll('[data-ec]').forEach(el => {
      const ix = +el.dataset.ec, l = lines[ix];
      combo(el, { list: () => items, value: l.newItem, placeholder: 'Type the item sent…', addWord: 'item', onPick: id => { l.newItem = id; if (!l.id) l.item_id = id; l.mode = null; draw(ix); } });
    });
    if (focusIx != null) wl.querySelector(`.wi[data-ix="${focusIx}"]`)?.focus();
  }
  draw();
  m.querySelector('[data-rs]').onchange = e => { resaleOn = e.target.checked; draw(); };
  combo(m.querySelector('.ac'), { list: () => items, value: null, clear: true, placeholder: '+ Add item', addWord: 'item',
    onPick: id => { lines.push({ id: null, item_id: id, newItem: id, added_by_ops: true, w: '', t: '0', mode: null, pack: [], rv: '' }); draw(lines.length - 1); } });
  m.querySelector('.mbox').addEventListener('click', e => { if (!e.target.closest('.dots')) m.querySelectorAll('.dm').forEach(x => x.classList.add('hide')); });
  m.querySelector('.mx').onclick = close; m.querySelector('[data-c]').onclick = close;
  setTimeout(() => m.querySelector('.wi')?.focus(), 50);

  m.querySelector('[data-d]').onclick = () => safe(async () => {
    for (const l of lines) {
      const n = item(l.newItem)?.name;
      if (l.mode === 'edit') throw new Error('Finish choosing the item first');
      if (l.mode === 'later' && !l.ld) throw new Error(`Choose the day for the new order (${n})`);
      if (l.mode) continue;
      if (l.w === '') throw new Error(`Fill in the kg for ${n} — or use ⋯`);
      if (!isNum(l.w)) throw new Error(`"${l.w}" is not a weight (${n})`);
      if (Number(l.w) - Number(l.t) * TRAY <= 0) throw new Error(`${n}: weight is less than the trays`);
      for (const r of (l.pack || [])) {
        if (r.packed === '') throw new Error(`${n}: fill in how many were packed for “${r.how}”`);
        if (!isNum(r.packed)) throw new Error(`${n}: "${r.packed}" is not a number`);
      }
      if (resaleOn) {
        if (l.rv === '') throw new Error(`${n}: fill in the resale price — or switch Resale off`);
        if (!isNum(l.rv)) throw new Error(`${n}: "${l.rv}" is not a price`);
      }
    }
    const payload = lines.map(l => {
      const ok = !l.mode;
      const x = { id: l.id || '', item_id: l.newItem, qty_sent: ok ? l.w : '', sent_unit: ok ? 'kg' : '', trays: ok ? l.t : '0', removed: !ok,
        later_date: l.mode === 'later' ? l.ld : '', later_qty: l.mode === 'later' ? qf(l.qty_ordered) : '',
        packing: (l.pack || []).map(r => ({ id: r.id, qty_packed: r.packed })) };
      if (resaleOn) x.resale_total = ok ? l.rv : '';
      return x;
    });
    await q(sb.rpc('ord_save', { p: { id: o.id, action: 'fulfil', resale_on: resaleOn, lines: payload } }));
    const moved = lines.filter(l => l.mode === 'later').length;
    close(); toast(`✓ ${cust(o.customer_id)?.name} done` + (moved ? ` · ${moved} item${moved > 1 ? 's' : ''} moved to a new order` : ''));
    procScreen();
  });
}

/* ================= XERO ================= */
let XERO = { connected: false };
async function xeroCall(body) {
  const { data, error } = await sb.functions.invoke('xero', { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function xeroStatus() { try { XERO = await xeroCall({ action: 'status' }); } catch { XERO = { connected: false }; } return XERO; }

/* ================= INVOICING ================= */
const I = { tab: 'todo', open: null };
async function invScreen() {
  await xeroStatus();
  $('#view').innerHTML = `<div class="pills">
      <button data-t="todo" class="${I.tab === 'todo' ? 'on' : ''}">To invoice</button>
      <button data-t="done" class="${I.tab === 'done' ? 'on' : ''}">Invoiced</button>
      <button data-t="waiting" class="${I.tab === 'waiting' ? 'on' : ''}">Not prepared yet</button></div><div class="olist" id="i-list"></div>`;
  document.querySelectorAll('.pills [data-t]').forEach(b => b.onclick = () => { I.tab = b.dataset.t; I.open = null; invScreen(); });
  const status = { todo: 'fulfilled', done: 'invoiced', waiting: 'new' }[I.tab];
  let qy = sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').eq('status', status);
  qy = I.tab === 'done' ? qy.order('invoiced_at', { ascending: false }).limit(200) : qy.order('delivery_date').order('id');
  const orders = await q(qy);
  orders.forEach(o => { o.lines = o.ord_lines.filter(l => !l.removed).sort((a, b) => a.position - b.position); delete o.ord_lines; });
  const list = $('#i-list');
  if (!orders.length) { list.innerHTML = `<div class="orow"><b>Nothing here</b></div>`; return; }
  const prices = I.tab === 'waiting' ? {} : await pricesFor(orders.flatMap(o => o.lines.map(l => l.id)));
  const last = {};
  if (I.tab === 'todo') (await q(sb.from('ord_last_prices').select('*').in('customer_id', [...new Set(orders.map(o => o.customer_id))]))).forEach(r => last[`${r.customer_id}|${r.item_id}|${r.unit}`] = r);
  orders.forEach(o => o.lines.forEach(l => {
    l.price = prices[l.id] ?? ''; l.last = last[`${o.customer_id}|${l.item_id}|${l.sent_unit}`];
    if (l.price === '' && l.last && I.tab === 'todo') l.price = l.last.price;
  }));
  const lt = l => isNum(l.price) && l.qty_net != null ? Math.round(Number(l.qty_net) * Number(l.price) * 100) / 100 : null;
  const tot = o => o.lines.reduce((s, l) => s + (lt(l) ?? 0), 0);
  const missing = o => o.lines.some(l => !isNum(l.price));
  orders.forEach(o => {
    const row = document.createElement('div'); row.className = 'orow' + (I.tab !== 'waiting' ? ' click' : '') + (I.open === o.id ? ' open' : '');
    row.innerHTML = `<span class="d">${ukDate(o.delivery_date)}</span><span class="c">${esc(cust(o.customer_id)?.name)}</span>
      <span class="i">${I.tab === 'waiting' ? itemsShort(o, false) : `#${o.id} · ${o.lines.length} item${o.lines.length === 1 ? '' : 's'}${o.invoice_number ? ' · ' + esc(o.invoice_number) : ''}`}</span>
      <span class="p" data-rt="${o.id}">${I.tab === 'waiting' ? '' : money(tot(o)) + (I.tab === 'todo' && missing(o) ? ' <span class="tag">prices?</span>' : '')}</span>
      <span class="chev">${I.tab === 'waiting' ? '' : I.open === o.id ? '▲' : '▼'}</span>`;
    list.appendChild(row);
    if (I.tab === 'waiting') return;
    row.onclick = () => { I.open = I.open === o.id ? null : o.id; invScreen(); };
    if (I.open !== o.id) return;
    const el = document.createElement('div'); el.className = 'oexp'; list.appendChild(el);
    const edit = I.tab === 'todo';
    el.innerHTML = `<table><thead><tr><th>Item</th><th class="num">Net sent</th><th class="num">Price</th><th class="num">Total</th></tr></thead><tbody>
      ${o.lines.map((l, ix) => `<tr><td>${esc(item(l.item_id)?.name)} ${tagHtml(l)}</td>
        <td class="num"><b>${qf(l.qty_net)} ${U(l.sent_unit)}</b>${l.trays > 0 ? `<div class="muted">${qf(l.qty_sent)} − ${l.trays} tray${l.trays > 1 ? 's' : ''}</div>` : ''}</td>
        <td class="num">${edit ? `£ <input class="price" inputmode="decimal" data-ix="${ix}" value="${esc(l.price)}"> /${per(l.sent_unit)}
          <div class="muted">${l.last ? `last ${money(l.last.price)} · ${ukDate(l.last.delivery_date)}` : 'no previous price'}</div>` : money(l.price) + '/' + per(l.sent_unit)}</td>
        <td class="num" data-lt="${ix}">${money(lt(l))}</td></tr>`).join('')}</tbody></table>
      <div class="total" data-tot>Total: ${money(tot(o))}</div>
      <div class="actions" style="justify-content:flex-end">${edit ? `
        <button class="btn" data-sp>Save prices</button>
        ${XERO.connected ? `<button class="link" data-manual>mark invoiced without Xero…</button>
        <button class="big blue" data-xs>Send to Xero</button>` : `
        <input placeholder="Xero invoice no. (optional)" style="width:230px" data-inv>
        <button class="big blue" data-mi>Mark invoiced</button>`}` : `${o.xero_invoice_id ? '<span class="muted">Sent to Xero as a draft</span>' : ''}<button class="btn" data-un>Undo invoiced</button>`}</div>`;
    if (!edit) {
      el.querySelector('[data-un]').onclick = () => safe(async () => {
        if (!confirm('Undo invoiced for #' + o.id + '?' + (o.xero_invoice_id ? '\n\nDelete the draft invoice ' + (o.invoice_number || '') + ' in Xero too, or you will get a duplicate when you send it again.' : ' (Fix the invoice in Xero too if needed.)'))) return;
        await q(sb.rpc('ord_save', { p: { id: o.id, action: 'uninvoice' } })); toast('Moved back to To invoice'); I.open = null; invScreen();
      });
      return;
    }
    el.querySelectorAll('input.price').forEach(i => i.oninput = () => {
      const l = o.lines[i.dataset.ix]; l.price = i.value.trim();
      el.querySelector(`[data-lt="${i.dataset.ix}"]`).textContent = money(lt(l));
      el.querySelector('[data-tot]').textContent = 'Total: ' + money(tot(o));
      row.querySelector(`[data-rt="${o.id}"]`).innerHTML = money(tot(o)) + (missing(o) ? ' <span class="tag">prices?</span>' : '');
    });
    const check = all => { for (const l of o.lines) {
        if (l.price !== '' && !isNum(l.price)) throw new Error(`"${l.price}" is not a price (${item(l.item_id)?.name})`);
        if (all && !isNum(l.price)) throw new Error(`Enter a price for ${item(l.item_id)?.name}`);
      } };
    const savePrices = () => q(sb.rpc('ord_save', { p: { id: o.id, action: 'prices', lines: o.lines.map(l => ({ id: l.id, price: l.price })) } }));
    const send = (action, invNo) => safe(async () => {
      check(action === 'invoice');
      await q(sb.rpc('ord_save', { p: { id: o.id, action, invoice_number: invNo ?? el.querySelector('[data-inv]')?.value ?? '', lines: o.lines.map(l => ({ id: l.id, price: l.price })) } }));

    el.querySelector('[data-manual]')?.addEventListener('click', () => { const n = prompt('Xero invoice number (optional):', ''); if (n !== null) send('invoice', n); });
    el.querySelector('[data-xs]')?.addEventListener('click', e => safe(async () => {
      check(true);
      const b = e.target; b.disabled = true; b.textContent = 'Sending…';
      try {
        await savePrices();
        const r = await xeroCall({ action: 'send', order_id: o.id });
        toast(`✓ Sent to Xero as draft ${r.invoice_number}`); I.open = null; invScreen();
      } finally { b.disabled = false; b.textContent = 'Send to Xero'; }
    }));
    el.querySelector('input.price')?.focus();
  });
}

  const list = (rows, kind) => rows.slice().sort((x, y) => (x.orphaned - y.orphaned) || x.name.localeCompare(y.name))
    .map(r => `<tr style="${r.orphaned ? 'color:#999' : ''}" data-name="${esc(r.name.toLowerCase())}"><td>${esc(r.name)} ${badge(r, kind)}</td>${kind === 'i' ? `<td class="muted num">${esc(r.xero_code || '')}</td>` : ''}</tr>`).join('');
  const nC = customers.filter(c => !c.orphaned).length, nI = items.filter(i => !i.orphaned).length;
  $('#view').innerHTML = `<div class="card"><h2>Xero</h2>
    ${XERO.connected ? `<p>✅ Connected to <b>${esc(XERO.tenant_name)}</b>. Customers and items come from Xero – press <b>Sync with Xero</b> after adding or changing them in Xero.</p>
      <div class="actions"><button class="big blue" id="x-sync">↻ Sync with Xero</button><button class="btn" id="x-con">Reconnect</button><button class="link" id="x-dis">Disconnect</button></div>
      <p class="muted" id="x-last">${last ? `Last sync ${new Date(last.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} by ${esc(uname(last.by))}: customers +${last.customers_added} added, ${last.customers_updated} updated, ${last.customers_archived} archived, ${last.customers_deleted} removed · items +${last.items_added} added, ${last.items_updated} updated, ${last.items_archived} archived, ${last.items_deleted} removed${last.error ? ` · <b style="color:#b3261e">stopped: ${esc(last.error)}</b>` : ''}` : 'Not synced yet.'}</p>`
    : `<p>Not connected. Click below and approve in Xero – you’ll come straight back here.</p>${XERO.client_hint ? `<p class="muted">Client ID in use: <b>${esc(XERO.client_hint)}</b> – it should match the Client ID on your Xero app page (32 characters).</p>` : ''}<div class="actions"><button class="big blue" id="x-con">Connect Xero</button></div>`}</div>
    <div class="card"><h2>Tray weight</h2>
    <div class="row" style="align-items:center"><div style="flex:none"><input id="s-tray" inputmode="decimal" style="width:120px;text-align:right" value="${TRAY}"></div><div style="flex:none">kg per tray</div>
    <div style="flex:none"><button class="btn blue" id="s-tsave">Save</button></div>
    <div class="muted">Processing enters how many trays; this weight × trays is taken off the weight. Changing it only affects weights entered from now on.</div></div></div>
    <div class="row" style="align-items:flex-start">
    <div class="card"><h2>Customers <span class="muted">${nC}</span></h2><div class="row"><input id="s-fc" placeholder="Search…"><button class="btn" style="flex:none" id="s-ac">+ New customer</button></div>
      <p class="muted">New customers added here are created in Xero automatically when their first invoice is sent.</p>
      <div style="max-height:520px;overflow:auto"><table><tbody id="s-tc">${list(customers, 'c')}</tbody></table></div></div>
    <div class="card"><h2>Items <span class="muted">${nI}</span></h2><div class="row"><input id="s-fi" placeholder="Search…"></div>
      <p class="muted">Add new items in Xero, then press Sync.</p>
      <div style="max-height:520px;overflow:auto"><table><tbody id="s-ti">${list(items, 'i')}</tbody></table></div></div></div>`;
  $('#x-con').onclick = () => safe(async () => { const r = await xeroCall({ action: 'auth_url' }); location.href = r.url; });
  if ($('#x-dis')) $('#x-dis').onclick = () => safe(async () => { if (!confirm('Disconnect Xero?')) return; await xeroCall({ action: 'disconnect' }); setupScreen(); });
  if ($('#x-sync')) $('#x-sync').onclick = e => safe(async () => {
    const b = e.target; b.disabled = true; b.textContent = 'Syncing…';
    try { const r = await xeroCall({ action: 'sync' }); toast(`Synced: ${r.customers_added} new customers, ${r.items_added} new items`); await setupScreen(); }
    finally { b.disabled = false; b.textContent = '↻ Sync with Xero'; }
  });
  $('#s-tsave').onclick = () => safe(async () => {
    const v = $('#s-tray').value.trim(); if (!isNum(v) || Number(v) < 0) throw new Error('Enter the tray weight in kg, e.g. 1.65');
    await q(sb.from('ord_settings').update({ value: String(Number(v)) }).eq('key', 'tray_kg')); TRAY = Number(v); toast('Tray weight saved');
  });
  const filt = (inp, tb) => inp.oninput = () => { const t = inp.value.trim().toLowerCase(); tb.querySelectorAll('tr').forEach(r => r.style.display = r.dataset.name.includes(t) ? '' : 'none'); };
  filt($('#s-fc'), $('#s-tc')); filt($('#s-fi'), $('#s-ti'));
  $('#s-ac').onclick = () => safe(async () => {
    const n = (prompt('New customer name (as it should appear in Xero):', $('#s-fc').value.trim()) || '').trim(); if (!n) return;
    const dup = customers.find(c => c.name.toLowerCase() === n.toLowerCase()); if (dup) throw new Error(`"${dup.name}" already exists`);
    await newCustomer(n); setupScreen();
  });
}

/* ================= ADMIN: staff ================= */
const GROUPS = { admin: 'Admin – sees everything', processing: 'Processing – prepares orders, no prices', invoicing: 'Invoicing – prices & invoices' };
async function staffScreen() {
  const people = await q(sb.from('ord_users').select('*').order('role').order('name'));
  const gsel = (v, attrs) => `<select ${attrs}>${Object.entries(GROUPS).map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const mine = p => p.email === me.toLowerCase();
  $('#view').innerHTML = `<div class="card"><h2>Staff</h2>
    <table><thead><tr><th>Name</th><th>Username</th><th>Group</th><th></th></tr></thead><tbody>${people.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(uname(p.email))}</td>
      <td>${mine(p) ? GROUPS[p.role] : gsel(p.role, `data-role="${esc(p.email)}"`)}</td>
      <td class="num">${mine(p) ? '<span class="muted">you</span>' : `<button class="link" data-pw="${esc(p.email)}">Reset password</button><button class="link" data-rm="${esc(p.email)}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>Add a person</h2>
    <div class="row"><div><label>Name</label><input id="p-name"></div><div><label>Username</label><input id="p-email" autocapitalize="none" spellcheck="false" placeholder="e.g. moshe"></div>
      <div><label>Password</label><input id="p-pass" placeholder="at least 6 characters"></div><div><label>Group</label>${gsel('processing', 'id="p-role"')}</div></div>
    <p class="muted">They sign in with the username and password. They can change the password with the “Password” link at the top, or you can reset it here.</p>
    <div class="actions"><button class="big" id="p-add">Add person</button></div></div>`;
  $('#p-add').onclick = () => safe(async () => {
    const u = await q(sb.rpc('ord_add_person', { p_email: $('#p-email').value, p_name: $('#p-name').value, p_password: $('#p-pass').value, p_role: $('#p-role').value }));
    toast('Added – login: ' + u); staffScreen();
  });
  document.querySelectorAll('[data-role]').forEach(s => s.onchange = () => safe(async () => { await q(sb.from('ord_users').update({ role: s.value }).eq('email', s.dataset.role)); toast('Group changed'); }));
  document.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => safe(async () => {
    const pw = prompt('New password for ' + uname(b.dataset.pw) + ' (at least 6 characters):'); if (pw == null) return;
    await q(sb.rpc('ord_set_password', { p_email: b.dataset.pw, p_password: pw })); toast('Password changed');
  }));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => safe(async () => {
    if (!confirm('Remove ' + uname(b.dataset.rm) + '?')) return; await q(sb.from('ord_users').delete().eq('email', b.dataset.rm)); toast('Removed'); staffScreen();
  }));
}

boot();
</script>
