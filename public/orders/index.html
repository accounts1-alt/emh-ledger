function combo(el, o) {
  el.classList.add('combo');

  const inp = el.querySelector('input'), box = el.querySelector('.opts');
  const nameOf = id => (o.list().find(r => r.id == id) || {}).name || '';
  inp.value = nameOf(o.value);
  let shown = [], hi = 0;
  function draw() {
    const t = inp.value.trim().toLowerCase(), words = t.split(/\s+/).filter(Boolean);
    shown = o.list().filter(r => r.active !== false && words.every(w => r.name.toLowerCase().includes(w))).slice(0, 40).map(r => ({ id: r.id, label: r.name }));
    if (o.onAdd && t && !o.list().some(r => r.name.toLowerCase() === t)) shown.push({ add: inp.value.trim(), label: `+ Add “${inp.value.trim()}” as a new ${o.addWord}` });
    hi = Math.min(hi, Math.max(0, shown.length - 1));
    box.innerHTML = shown.length ? shown.map((s, i) => `<div class="opt ${s.add != null ? 'add' : ''} ${i === hi ? 'hi' : ''}" data-i="${i}">${esc(s.label)}</div>`).join('') : `<div class="opt muted">Nothing found${o.addWord === 'item' ? ' – add it in Xero, then Sync in Settings' : ''}</div>`;
    box.classList.remove('hide');
  }
  async function pick(s) {
    if (!s) return;
    box.classList.add('hide');
    if (s.add != null) { const row = await safe(() => o.onAdd(s.add)); if (!row) return; o.value = row.id; inp.value = o.clear ? '' : row.name; o.onPick(row.id); }
    else { o.value = s.id; inp.value = o.clear ? '' : s.label; o.onPick(s.id); }
  }
  inp.onfocus = () => { inp.select(); hi = 0; draw(); };
  inp.oninput = () => { hi = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); const s = shown[hi]; inp.blur(); pick(s); }
    else if (e.key === 'Escape') inp.blur();
  };
  inp.onblur = () => setTimeout(() => { box.classList.add('hide'); inp.value = o.clear ? '' : nameOf(o.value); }, 180);
  box.onmousedown = e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); const s = shown[+d.dataset.i]; inp.blur(); pick(s); } };
  return { focus: () => inp.focus() };
}

/* Does it build back to full birds? rows: [{item_id, packs}] */
function birdCheck(birds, rows) {
  const used = {}; let whole = 0;
  rows.forEach(r => { const u = item(r.item_id)?.uses || {}, n = Number(r.packs) || 0;
    Object.entries(u).forEach(([k, v]) => { if (!isNum(v) || !Number(v)) return; if (k === 'bird') whole += n * Number(v); else used[k] = (used[k] || 0) + n * Number(v); }); });
  const left = (Number(birds) || 0) - whole;
  return { whole, left, parts: PARTS.map(p => { const k = partKey(p.part), av = Math.max(0, left) * Number(p.per_bird || 0), us = used[k] || 0;
    return { part: p.part, avail: av, used: us, counted: k in used, diff: us - av }; }) };
}
function birdCheckHtml(birds, rows) {

async function copyOrder(fromId) {

let XERO = { connected: false };
async function xeroCall(body) {
  const { data, error } = await sb.functions.invoke('xero', { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function xeroStatus() { try { XERO = await xeroCall({ action: 'status' }); } catch { XERO = { connected: false }; } return XERO; }

function taskModal(kind, t) {

    <div class="mh"><div class="mt">${t ? 'Edit ' + label.toLowerCase() : 'New ' + label.toLowerCase()}</div><button class="mx" aria-label="Close">✕</button></div>

  const inp = m.querySelector('#tk-text'); setTimeout(() => inp.focus(), 50);

/* ================= DASHBOARD ================= */
const steps = (st, sm) => { const a = st === 'draft' ? 0 : st === 'new' ? 1 : st === 'fulfilled' ? 2 : 3, d = i => st === 'invoiced' || i < a;
  return `<div class="steps ${sm ? 'sm' : ''}">${['Order', 'Pack & weigh', 'Invoice'].map((t, i) => `<span class="${d(i) ? 'd' : i === a ? 'n' : ''}">${d(i) ? '✓' : i + 1} ${t}</span>`).join('')}</div>`; };
const weekStart = (off = 0) => { const d = new Date(); d.setHours(12); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d.toLocaleDateString('en-CA'); };
const monthStart = (off = 0) => { const d = new Date(); d.setHours(12); d.setDate(1); d.setMonth(d.getMonth() + off); return d.toLocaleDateString('en-CA'); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
const lineAmt = x => x.qty != null && x.price != null ? Math.round(Number(x.qty) * Number(x.price) * (1 - (Number(x.discount) || 0) / 100) * 100) / 100 : 0;
async function loadFull(id) {
  const o = await q(sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').eq('id', id).single());
  o.lines = o.ord_lines.sort((a, b) => a.position - b.position); delete o.ord_lines; return o;
}
async function continueOrder(id) {
  const o = await loadFull(id);
  if (o.status === 'new' && role !== 'invoicing') return openWeigh(o);
  if (o.status !== 'new' && role !== 'processing') {
    o.lines = o.lines.filter(l => !l.removed);
    const pr = await pricesFor(o.lines.map(l => l.id)); o.lines.forEach(l => l.price = pr[l.id] ?? '');
    return invOpen(o);
  }
  if (o.status !== 'new') return openDone(o);
  toast('Waiting to be packed');
}
async function dashScreen() {
  const today = isoDay(0), from8 = weekStart(-7), money0 = role !== 'processing';
  const since7 = new Date(Date.now() - 7 * 864e5).toISOString();
  const [open, done, tasks, hist] = await Promise.all([
    q(sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').neq('status', 'invoiced').order('prep_date').order('id')),
    q(sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').eq('status', 'invoiced').gte('invoiced_at', since7).order('invoiced_at', { ascending: false }).limit(30)),
    q(sb.from('ord_tasks').select('id, kind, due_date').eq('done', false)),
    q(sb.from('ord_orders').select('id, delivery_date, status, birds, ord_lines!ord_lines_order_id_fkey(id, item_id, qty_net, qty_sent, sent_unit, removed, position)').gte('delivery_date', from8)),
  ]);
  [...open, ...done].forEach(o => { o.lines = o.ord_lines.filter(l => !l.removed).sort((a, b) => a.position - b.position); delete o.ord_lines; });
  // money per week (last 8 weeks, invoiced orders)
  const wk = d => { const w = new Date(d + 'T12:00:00'); w.setDate(w.getDate() - ((w.getDay() + 6) % 7)); return w.toLocaleDateString('en-CA'); };
  const weeks = [...Array(8)].map((_, i) => weekStart(i - 7)), perWeek = Object.fromEntries(weeks.map(w => [w, 0]));
  if (money0) { const inv = hist.filter(o => o.status === 'invoiced'), byId = new Map(inv.map(o => [o.id, o]));
    inv.forEach(o => { o.lines = (o.ord_lines || []).filter(l => !l.removed); });
    (await moneyLines(inv)).forEach(x => { const k = wk(byId.get(x.order_id).delivery_date); if (k in perWeek) perWeek[k] += lineAmt(x); }); }
  // packing load: next 7 days (late counted on today)
  const days = [...Array(7)].map((_, i) => isoDay(i)), load = Object.fromEntries(days.map(d => [d, 0]));
  open.filter(o => o.status === 'new').forEach(o => { const d = o.prep_date < today ? today : o.prep_date; if (d in load) load[d]++; });
  const toPack = open.filter(o => o.status === 'new'), toInv = open.filter(o => o.status === 'fulfilled');
  const late = toPack.filter(o => o.prep_date < today).length, todayN = toPack.filter(o => o.prep_date <= today).length;
  const thisWk = perWeek[weekStart(0)] || 0, lastWk = perWeek[weekStart(-1)] || 0;
  const birdsWk = hist.filter(o => o.delivery_date >= weekStart(0)).reduce((s, o) => s + (Number(o.birds) || 0), 0);
  const h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const nm = uname(me), name = nm.charAt(0).toUpperCase() + nm.slice(1);
  const kpi = (n, t, s, cls) => `<div class="kpi ${cls || ''}"><b>${n}</b><span>${t}</span>${s ? `<i>${s}</i>` : ''}</div>`;
  const short = v => v >= 1000 ? '£' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : '£' + Math.round(v);
  const chart = (title, keys, vals, lab, fmt, hiKey) => { const mx = Math.max(1, ...vals);
    return `<div class="chart"><div class="sech">${title}</div><div class="cbars">${keys.map((k, i) => `<div class="cb ${k === hiKey ? 'on' : ''}" title="${esc(lab(k))}: ${fmt(vals[i])}">

  const dayLab = d => d === today ? 'Today' : new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
  const wkLab = w => new Date(w + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const card = o => `<button class="dcard ${o.status === 'new' && o.prep_date < today ? 'late' : ''}" data-o="${o.id}">
      <span class="dn">${esc(cust(o.customer_id)?.name)}</span>
      <span class="ds">${o.status === 'new' ? (o.prep_date < today ? `<b class="late-t">Late · ${ukDate(o.prep_date)}</b>` : o.prep_date === today ? 'Today' : ukDate(o.prep_date))

  $('#view').innerHTML = `

      ${role === 'admin' ? '<button class="big" id="d-new" style="margin-left:14px">+ New order</button>' : ''}</span></div>

/* ================= ORDERING: every order ================= */
const H = { f: 'open', range: 'all', search: '' };
const rangeOf = r => r === 'week' ? [weekStart(0), addDays(weekStart(0), 6)] : r === 'lweek' ? [weekStart(-1), addDays(weekStart(0), -1)]
  : r === 'month' ? [monthStart(0), addDays(monthStart(1), -1)] : r === 'lmonth' ? [monthStart(-1), addDays(monthStart(0), -1)] : [null, null];
async function ordersScreen() {
  const today = isoDay(0);
  const [a, b] = rangeOf(H.range);
  let qi = sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').eq('status', 'invoiced');
  qi = a ? qi.gte('delivery_date', a).lte('delivery_date', b) : qi;
  const [open, invd, tasks] = await Promise.all([
    q(sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').neq('status', 'invoiced').order('prep_date').order('id')),
    q(qi.order('invoiced_at', { ascending: false }).limit(a ? 1000 : 60)),
    q(sb.from('ord_tasks').select('*').or(`done.eq.false,done_at.gte.${new Date(Date.now() - 14 * 864e5).toISOString()}`).order('due_date').order('created_at')),

  const match = o => { const t = H.search.trim().toLowerCase().replace(/^#/, ''); if (!t) return true;
    return String(o.id) === t || (cust(o.customer_id)?.name || '').toLowerCase().includes(t) || o.lines.some(l => (item(l.item_id)?.name || '').toLowerCase().includes(t)); };
  const pkey = o => o.prep_date < today ? 'late' : o.prep_date;

      <td class="${o.status === 'new' && o.prep_date < today ? 'late-t' : ''}">${o.prep_date === today ? 'Today' : ukDate(o.prep_date)}</td><td>${ukDate(o.delivery_date)}</td>

/* ================= REPORTING ================= */
const R = { range: 'month', from: '', to: '', cust: null, view: 'cust' };
async function reportsScreen() {
  if (R.view === 'resale' && role !== 'admin') R.view = 'cust';
  let [a, b] = R.range === 'custom' ? [R.from, R.to] : rangeOf(R.range);
  if (!a) { a = monthStart(0); b = addDays(monthStart(1), -1); }
  let qy = sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').gte('delivery_date', a).lte('delivery_date', b).order('delivery_date');
  if (R.cust) qy = qy.eq('customer_id', R.cust);
  const orders = await q(qy);
  orders.forEach(o => { o.lines = o.ord_lines.filter(l => !l.removed); delete o.ord_lines; });
  const ids = orders.map(o => o.id), lids = orders.flatMap(o => o.lines.map(l => l.id));
  const il = await moneyLines(orders);
  const rs = role === 'admin' ? await resaleFor(lids) : {};
  const oById = new Map(orders.map(o => [o.id, o]));
  const inv = il.filter(x => oById.get(x.order_id)?.status === 'invoiced');
  const total = inv.reduce((s, x) => s + lineAmt(x), 0);
  const kgSent = orders.filter(o => o.status !== 'new').reduce((s, o) => s + o.lines.reduce((t, l) => t + (l.sent_unit === 'kg' ? Number(l.qty_net) || 0 : 0), 0), 0);
  const birds = orders.reduce((s, o) => s + (Number(o.birds) || 0), 0);
  const notInv = orders.filter(o => o.status !== 'invoiced').length;
  const n0 = v => v ? Math.round(v).toLocaleString('en-GB') : '—', n1 = v => v ? (Math.round(v * 10) / 10).toLocaleString('en-GB') : '—';
  const wkOf = d => { const w = new Date(d + 'T12:00:00'); w.setDate(w.getDate() - ((w.getDay() + 6) % 7)); return w.toLocaleDateString('en-CA'); };
  // build rows + columns for the chosen report
  const M = new Map(), get = k => { if (!M.has(k)) M.set(k, { k, orders: new Set(), kg: 0, packs: 0, amt: 0, birds: 0, bkg: 0, cpk: 0, fkg: 0, fpk: 0 }); return M.get(k); };
  let cols, chartOf, title, sortBy = 'amt';
  if (R.view === 'cust' || R.view === 'item') {
    inv.forEach(x => { const o = oById.get(x.order_id), r = get(R.view === 'cust' ? cust(o.customer_id)?.name || '?' : x.description || item(x.item_id)?.name || '?');
      r.orders.add(o.id); r.amt += lineAmt(x); if (x.unit === 'kg') r.kg += Number(x.qty) || 0; else r.packs += Number(x.qty) || 0; });
    title = R.view === 'cust' ? 'Customer' : 'Item';
    cols = [[title, r => `<b>${esc(r.k)}</b>`], ['Orders', r => r.orders.size, 'num'], ['Kg', r => n1(r.kg), 'num'], ['Packets / units', r => n0(r.packs), 'num'],
      ...(R.view === 'item' ? [['Avg £/kg', r => r.kg && !r.packs ? money(r.amt / r.kg) : '—', 'num']] : []), ['Invoiced', r => money(r.amt), 'num b'], ['Share', r => total ? Math.round(r.amt / total * 100) + '%' : '', 'num muted']];
    chartOf = r => r.amt;
  } else if (R.view === 'resale') {
    orders.forEach(o => o.lines.forEach(l => { if (rs[l.id] == null) return; const r = get(cust(o.customer_id)?.name || '?'); r.orders.add(o.id); r.amt += Number(rs[l.id]); r.kg += l.sent_unit === 'kg' ? Number(l.qty_net) || 0 : 0; }));
    title = 'Customer';
    cols = [['Customer', r => `<b>${esc(r.k)}</b>`], ['Orders', r => r.orders.size, 'num'], ['Kg', r => n1(r.kg), 'num'], ['Resale', r => money(r.amt), 'num b']];
    chartOf = r => r.amt;
  } else {   // chickens & packing, per week
    orders.filter(o => o.status !== 'new').forEach(o => { const r = get(wkOf(o.delivery_date)); r.orders.add(o.id); r.birds += Number(o.birds) || 0;
      o.lines.forEach(l => { const L = listOf(l.item_id), pk = Number(l.packs_made) || 0; if (L === 'chicken') { r.cpk += pk; r.bkg += Number(l.qty_net) || 0; } if (L === 'beef') { r.fpk += pk; r.fkg += Number(l.qty_net) || 0; } }); });
    title = 'Week'; sortBy = 'k';
    cols = [['Week of', r => `<b>${ukDate(r.k)}</b>`], ['Orders', r => r.orders.size, 'num'], ['Chickens', r => n0(r.birds), 'num b'], ['Chicken packing kg', r => n1(r.bkg), 'num'],
      ['Chicken packs', r => n0(r.cpk), 'num'], ['Beef packing kg', r => n1(r.fkg), 'num'], ['Beef packs', r => n0(r.fpk), 'num']];
    chartOf = r => r.birds;
  }
  const rows = [...M.values()].sort((x, y) => sortBy === 'k' ? x.k.localeCompare(y.k) : y.amt - x.amt);
  const top = sortBy === 'k' ? rows : rows.slice(0, 12), mx = Math.max(1, ...top.map(chartOf));
  const fmtC = R.view === 'chick' ? v => n0(v) : v => money(v);
  const chartHtml = sortBy === 'k'
    ? `<div class="cbars" style="height:190px">${top.map(r => `<div class="cb on"><span class="cv">${chartOf(r) ? n0(chartOf(r)) : ''}</span><span class="cbar" style="height:${Math.max(chartOf(r) ? 5 : 2, chartOf(r) / mx * 100)}%"></span><span class="cl">${ukDate(r.k).replace(/^\w+ /, '')}</span></div>`).join('')}</div>`
    : top.map(r => `<div class="hbar"><span class="hl">${esc(r.k)}</span><span class="ht"><span class="bar" style="width:${Math.max(1, chartOf(r) / mx * 100)}%"></span></span><span class="hv">${fmtC(chartOf(r))}</span></div>`).join('');
  const foot = rows.length > 1 && R.view !== 'chick' ? `<tr class="tfoot"><td><b>Total</b></td>${cols.slice(1).map(([h, , c]) => `<td class="${c || ''}">${h === 'Orders' ? new Set(rows.flatMap(r => [...r.orders])).size : h === 'Kg' ? n1(rows.reduce((s, r) => s + r.kg, 0)) : h === 'Packets / units' ? n0(rows.reduce((s, r) => s + r.packs, 0)) : h === 'Invoiced' || h === 'Resale' ? money(rows.reduce((s, r) => s + r.amt, 0)) : ''}</td>`).join('')}</tr>`
    : rows.length > 1 ? `<tr class="tfoot"><td><b>Total</b></td>${cols.slice(1).map(([h, , c]) => { const f = { Orders: r => r.orders.size, Chickens: r => r.birds, 'Chicken packing kg': r => r.bkg, 'Chicken packs': r => r.cpk, 'Beef packing kg': r => r.fkg, 'Beef packs': r => r.fpk }[h]; const v = rows.reduce((s, r) => s + f(r), 0); return `<td class="${c || ''}">${/kg/.test(h) ? n1(v) : n0(v)}</td>`; }).join('')}</tr>` : '';
  const custs = customers.filter(c => !c.orphaned).sort((x, y) => x.name.localeCompare(y.name));
  const chip = (k, t, on, attr) => `<button class="chip ${on ? 'on' : ''}" ${attr}="${k}">${t}</button>`;
  const views = [['cust', 'Sales by customer'], ['item', 'Sales by item'], ['chick', 'Chickens & packing']].concat(role === 'admin' ? [['resale', 'Resale']] : []);
  $('#view').innerHTML = `
    <div class="fbar">${[['week', 'This week'], ['lweek', 'Last week'], ['month', 'This month'], ['lmonth', 'Last month'], ['custom', '📅 Pick dates']].map(([k, t]) => chip(k, t, R.range === k, 'data-r')).join('')}
      ${R.range === 'custom' ? `<input type="date" id="r-a" class="fsel" value="${esc(a)}"> to <input type="date" id="r-b" class="fsel" value="${esc(b)}">` : ''}
      <select id="r-cust" class="fsel">${['<option value="">All customers</option>', ...custs.map(c => `<option value="${c.id}" ${R.cust == c.id ? 'selected' : ''}>${esc(c.name)}</option>`)].join('')}</select>
      <button class="btn grow" id="r-dl">⬇ Download</button></div>
    <div class="muted" style="margin:-6px 0 12px">${ukDate(a)} – ${ukDate(b)} · by delivery date${notInv ? ` · ${notInv} order${notInv === 1 ? '' : 's'} not invoiced yet (not in the £)` : ''}</div>
    <div class="kpis"><div class="kpi"><b>${money(total)}</b><span>Invoiced</span></div><div class="kpi"><b>${orders.length}</b><span>Orders</span></div>
      <div class="kpi"><b>${birds.toLocaleString('en-GB')}</b><span>Chickens</span></div><div class="kpi"><b>${Math.round(kgSent).toLocaleString('en-GB')} kg</b><span>Sent</span></div></div>
    <div class="fbar">${views.map(([k, t]) => chip(k, t, R.view === k, 'data-v')).join('')}</div>
    ${rows.length ? `<div class="card rchart"><div class="sech">${R.view === 'chick' ? 'Chickens per week' : R.view === 'resale' ? 'Resale' : 'Top ' + Math.min(12, rows.length) + ' by £'}</div>${chartHtml}</div>
      <div class="card rtable"><div class="otw"><table class="otab rt"><thead><tr>${cols.map(([h, , c]) => `<th class="${(c || '').replace(' b', '').replace(' muted', '')}">${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${cols.map(([, f, c]) => `<td class="${c || ''}">${f(r)}</td>`).join('')}</tr>`).join('')}${foot}</tbody></table></div></div>`
      : `<div class="card"><div class="empty">Nothing ${R.view === 'resale' ? 'with resale' : R.view === 'chick' ? 'packed' : 'invoiced'} in these dates</div></div>`}`;
  document.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { R.range = x.dataset.r; if (R.range === 'custom' && !R.from) { R.from = a; R.to = b; } reportsScreen(); });
  document.querySelectorAll('[data-v]').forEach(x => x.onclick = () => { R.view = x.dataset.v; reportsScreen(); });
  $('#r-cust').onchange = e => { R.cust = e.target.value ? Number(e.target.value) : null; reportsScreen(); };
  if ($('#r-a')) { $('#r-a').onchange = e => { R.from = e.target.value; reportsScreen(); }; $('#r-b').onchange = e => { R.to = e.target.value; reportsScreen(); }; }
  $('#r-dl').onclick = () => {
    const strip = h => String(h).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>');

    const csv = [cols.map(([h]) => cell(h)).join(','), ...rows.map(r => cols.map(([, f]) => cell(strip(f(r)))).join(','))];
    const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([csv.join('\n')], { type: 'text/csv' }));
    el.download = `em-h-${views.find(v => v[0] === R.view)[1].toLowerCase().replace(/[^a-z]+/g, '-')}-${a}-to-${b}.csv`; el.click();
  };

/* a chicken pack: name and what one pack uses (whole birds or pieces) */
function chickenItemModal(id) {
  const i = item(id), u = { ...(i.uses || {}) };
  const { m, close } = modal(`
    <div class="mh"><div><div class="mt">Chicken pack</div><div class="ms">What goes into one pack – used to check orders build back to full birds.</div></div><button class="mx" aria-label="Close">✕</button></div>
    <label>Name</label><input data-n value="${esc(i.name)}">
    <label style="margin-top:12px">One pack uses</label>
    <div class="row prt"><span style="flex:1">Whole birds</span><input data-u="bird" inputmode="decimal" style="width:90px;flex:none" placeholder="—" value="${esc(u.bird ?? '')}"></div>
    ${PARTS.map(p => `<div class="row prt"><span style="flex:1">${esc(p.part)}</span><input data-u="${esc(partKey(p.part))}" inputmode="decimal" style="width:90px;flex:none" placeholder="—" value="${esc(u[partKey(p.part)] ?? '')}"></div>`).join('')}
    <p class="muted" style="font-size:13px">e.g. “Roaster in 8” = 1 whole bird · “Wings ×6” = 6 wings · “Legs ×4” = 4 thighs + 4 drumsticks. Leave schnitzel empty – it goes by weight.</p>
    <div class="mf"><button class="mbtn ghost" data-c>Cancel</button><button class="mbtn go" data-s>Save</button></div>`);
  m.querySelector('.mx').onclick = close; m.querySelector('[data-c]').onclick = close;
  m.querySelector('[data-s]').onclick = () => safe(async () => {

    await q(sb.from('ord_items').update({ name: n, uses }).eq('id', id)); close(); toast('Saved'); setupScreen();
  });
}

/* One customer: their templates (usual orders with charges) and, as a fallback, their price list */
async function customerModal(cid) {
  await loadTemplates();
  const c = cust(cid), tpls = TEMPLATES.filter(t => t.customer_id === cid);
  const rl = await q(sb.from('ord_price_rules').select('id').eq('customer_id', cid));
  const chargeTxt = t => { const r = tplRules(t); if (!r.length) return '<span class="late-t">no charges yet</span>';
    const w = r.find(x => !x.applies_to); const bits = [];
    if (w?.meat_price != null) bits.push(`meat ${money(w.meat_price)}/${w.meat_per}`); if (w?.proc_price != null) bits.push(`processing ${money(w.proc_price)}/${w.proc_per}`);
    const own = r.filter(x => x.applies_to).length; if (own) bits.push(`${own} product price${own > 1 ? 's' : ''}`); return bits.join(' · '); };
  const { m, close } = modal(`
    <div class="mh"><div><div class="mt">${esc(c?.name)}</div><div class="ms">Templates are this customer’s usual orders – products, packets, resale prices and how they are charged.</div></div><button class="mx" aria-label="Close">✕</button></div>
    ${tpls.length ? `<table><tbody>${tpls.map(t => `<tr><td><b>${esc(t.name)}</b><div class="muted" style="font-size:13px">${esc(item(t.item_id)?.name || 'no item')} · ${(t.rows || []).length} product${(t.rows || []).length === 1 ? '' : 's'} · ${chargeTxt(t)}</div></td>
      <td style="text-align:right;white-space:nowrap"><button class="link" data-ed="${t.id}">Edit</button> &nbsp; <button class="link" data-dl="${t.id}" style="color:#e5484d">Delete</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">No templates yet.</p>'}
    <div class="actions"><button class="btn blue" data-new>+ New template</button></div>
    <p class="muted" style="font-size:13px;margin-top:14px">Orders entered without a template are charged from the ${rl.length ? '' : 'optional '}<button class="link" data-pl>price list</button>${rl.length ? ' (set)' : ''}, or priced by hand.</p>
    <div class="mf"><button class="mbtn go" data-c>Close</button></div>`);
  m.querySelector('.mbox').classList.add('wide');
  m.querySelector('.mx').onclick = close; m.querySelector('[data-c]').onclick = close;
  m.querySelector('[data-new]').onclick = () => { close(); templateModal(cid, null); };
  m.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { close(); templateModal(cid, TEMPLATES.find(t => t.id == b.dataset.ed)); });
  m.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => safe(async () => { const t = TEMPLATES.find(x => x.id == b.dataset.dl);
    if (!confirm(`Delete the template “${t.name}”? Orders already entered keep their charges.`)) return;
    await q(sb.from('ord_templates').delete().eq('id', t.id)); close(); customerModal(cid); }));
  m.querySelector('[data-pl]').onclick = () => { close(); priceListModal(cid); };
}

      <button class="link" data-x="${i}" aria-label="Remove">✕</button></div>`).join('');
    box.querySelectorAll('[data-f]').forEach(e => e[e.tagName === 'SELECT' ? 'onchange' : 'oninput'] = () => T.rows[e.dataset.i][e.dataset.f] = e.value.trim());
    box.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { T.rows.splice(+b.dataset.x, 1); draw(); });
  };
  draw();
  m.querySelector('[data-add]').onclick = () => { T.rows.push({ how: '', qty: '', rp_price: '', rp_per: 'kg', meat_price: '', meat_per: 'kg', proc_price: '', proc_per: 'kg' }); draw(); box.querySelectorAll('[data-f="how"]')[T.rows.length - 1].focus(); };
  const back = () => { close(); customerModal(cid); };
  m.querySelector('.mx').onclick = back; m.querySelector('[data-c]').onclick = back;
  m.querySelector('[data-s]').onclick = () => safe(async () => {
    const name = (T.name || '').trim(); if (!name) throw new Error('Give the template a name');
    if (!T.item_id) throw new Error('Choose the item it goes on (e.g. Assorted Meats)');
    const num = (x, what) => { if (x === '' || x == null) return null; if (!isNum(x)) throw new Error(`“${x}” is not a number (${what})`); return Number(x); };
    const whole = { meat_price: num(T.whole.meat_price, 'meat'), meat_per: T.whole.meat_per || 'kg', proc_price: num(T.whole.proc_price, 'processing'), proc_per: T.whole.proc_per || 'kg' };
    const seen = new Set();
    const rows = T.rows.filter(r => (r.how || '').trim()).map(r => { const h = r.how.trim(); if (seen.has(h.toLowerCase())) throw new Error(`“${h}” is in the list twice`); seen.add(h.toLowerCase());
      return { how: h, qty: num(r.qty, h), rp_price: num(r.rp_price, h), rp_per: r.rp_per || 'kg', meat_price: num(r.meat_price, h), meat_per: r.meat_per || 'kg', proc_price: num(r.proc_price, h), proc_per: r.proc_per || 'kg' }; });
    const rec = { customer_id: cid, name, item_id: T.item_id, unit: T.unit || 'units', whole, rows, updated_at: new Date().toISOString() };
    if (t) await q(sb.from('ord_templates').update(rec).eq('id', t.id)); else await q(sb.from('ord_templates').insert(rec));
    toast('Template saved'); back(); if (cur === 'setup') setupScreen();
  });
}

/* Customer price list: a row for all items and/or rows for one item (or packed item). Blank price = not charged. */
const PER = { kg: 'per kg', pack: 'per packet', unit: 'per unit/chicken' };
async function priceListModal(cid) {
  const c = cust(cid);
  let rows = (await q(sb.from('ord_price_rules').select('*').eq('customer_id', cid).order('position'))).map(r => ({ ...r, meat_price: r.meat_price != null ? qf(r.meat_price) : '', proc_price: r.proc_price != null ? qf(r.proc_price) : '' }));
  if (!rows.length) rows = [{ applies_to: '', meat_price: '', meat_per: 'kg', proc_price: '', proc_per: 'kg' }];
  await loadPackWords();
  const names = [...new Set([...items.filter(i => !i.orphaned).map(i => i.name), ...PACK_WORDS])].sort();
  const perSel = (v, a) => `<select ${a}>${Object.entries(PER).map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const { m, close } = modal(`
    <div class="mh"><div><div class="mt">Price list – ${esc(c?.name)}</div><div class="ms">Invoices for this customer are worked out from this. Leave a price empty if it isn’t charged.</div></div><button class="mx" aria-label="Close">✕</button></div>
    <datalist id="pl-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="prh"><span>Applies to</span><span>Meat £</span><span></span><span>Processing £</span><span></span><span></span></div>
    <div data-rows></div>
    <button class="link" data-add>+ Add a row for one item</button>
    <p class="muted" style="font-size:13px;margin-top:10px">A row for one item (e.g. “Minced Beef” or “Chicken”) replaces the prices it fills in; anything left empty comes from the “All items” row. Put 0 for “not charged”. Item names match the packing lines or the item on the order.</p>
    <div class="mf"><button class="mbtn ghost" data-c>Cancel</button><button class="mbtn go" data-s>Save price list</button></div>`);
  m.querySelector('.mbox').classList.add('wide');
  const box = m.querySelector('[data-rows]');
  const draw = () => {
    box.innerHTML = rows.map((r, i) => `<div class="prr">
      <input data-f="applies_to" data-i="${i}" list="pl-names" placeholder="All items" value="${esc(r.applies_to)}">
      <input data-f="meat_price" data-i="${i}" inputmode="decimal" placeholder="—" value="${esc(r.meat_price)}">${perSel(r.meat_per, `data-f="meat_per" data-i="${i}"`)}
      <input data-f="proc_price" data-i="${i}" inputmode="decimal" placeholder="—" value="${esc(r.proc_price)}">${perSel(r.proc_per, `data-f="proc_per" data-i="${i}"`)}
      <button class="link" data-x="${i}" aria-label="Remove row">✕</button></div>`).join('');
    box.querySelectorAll('[data-f]').forEach(e => e[e.tagName === 'SELECT' ? 'onchange' : 'oninput'] = () => rows[e.dataset.i][e.dataset.f] = e.value.trim());
    box.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.x, 1); draw(); });
  };
  draw();
  m.querySelector('[data-add]').onclick = () => { rows.push({ applies_to: '', meat_price: '', meat_per: 'kg', proc_price: '', proc_per: 'kg' }); draw(); box.querySelectorAll('[data-f="applies_to"]')[rows.length - 1].focus(); };
  m.querySelector('.mx').onclick = close; m.querySelector('[data-c]').onclick = close;
  m.querySelector('[data-s]').onclick = () => safe(async () => {
    const keep = rows.filter(r => r.applies_to || r.meat_price || r.proc_price);
    const seen = new Set();
    for (const r of keep) {
      const k = r.applies_to.toLowerCase(); if (seen.has(k)) throw new Error(`“${r.applies_to || 'All items'}” is in the list twice`); seen.add(k);
      for (const f of ['meat_price', 'proc_price']) if (r[f] && !isNum(r[f])) throw new Error(`“${r[f]}” is not a price (${r.applies_to || 'All items'})`);
      if (!r.meat_price && !r.proc_price) throw new Error(`${r.applies_to || 'All items'}: fill in a meat or processing price`);
    }
    await q(sb.from('ord_price_rules').delete().eq('customer_id', cid));
    if (keep.length) await q(sb.from('ord_price_rules').insert(keep.map((r, i) => ({ customer_id: cid, applies_to: r.applies_to, meat_price: r.meat_price || null, meat_per: r.meat_per, proc_price: r.proc_price || null, proc_per: r.proc_per, position: i }))));
    close(); toast('Price list saved'); if (cur === 'setup') setupScreen();
  });
}

/* Work out invoice lines from the customer's price list and what processing sent */
const nm = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function workOutInvoice(o, rules) {
  const all = rules.find(r => !r.applies_to.trim());
  const own = name => rules.find(r => r.applies_to.trim() && nm(r.applies_to) === nm(name));
  // an item's own row only replaces the prices it fills in; empty ones come from the "All items" row
  const ruleFor = name => { const r = own(name); if (!r) return null; if (!all) return { ...r, ownProc: r.proc_price != null };
    return { ...r, ownProc: r.proc_price != null, meat_price: r.meat_price ?? all.meat_price, meat_per: r.meat_price != null ? r.meat_per : all.meat_per, proc_price: r.proc_price ?? all.proc_price, proc_per: r.proc_price != null ? r.proc_per : all.proc_per }; };
  const out = [], proc = new Map();
  const qtyOf = (t, per) => per === 'kg' ? t.kg : per === 'pack' ? t.packs : t.units;
  const add = (t, r, itemId, both) => {
    if (!r) { out.push({ item_id: itemId, description: t.name, qty: t.kg, unit: 'kg', price: '', kind: 'meat', why: 'no price in the price list' }); return; }
    if (r.meat_price != null && Number(r.meat_price) > 0) out.push({ item_id: itemId, description: both && Number(r.proc_price) > 0 ? `${t.name} – meat` : t.name, qty: qtyOf(t, r.meat_per), unit: r.meat_per, price: qf(r.meat_price), kind: 'meat' });
    if (r.proc_price != null && Number(r.proc_price) > 0) {
      const k = `${itemId}|${r.proc_price}|${r.proc_per}|${r.ownProc ? t.name : ''}`;
      const g = proc.get(k) || { item_id: itemId, description: r.ownProc ? `Processing – ${t.name}` : 'Processing', qty: 0, unit: r.proc_per, price: qf(r.proc_price), kind: 'proc', missing: false };
      const qn = qtyOf(t, r.proc_per); if (qn == null) g.missing = true; else g.qty += Number(qn);
      proc.set(k, g);
    }
  };
  for (const l of o.lines) {
    if (l.removed || l.qty_net == null) continue;
    const name = item(l.item_id)?.name || '';
    const units = l.packs_made != null ? Number(l.packs_made) : l.unit === 'units' && !l.added_by_ops ? Number(l.qty_ordered) : null;
    const sent = (l.pack || []).filter(r => Number(r.qty_packed) > 0);
    const lineRule = own(name) ? ruleFor(name) : null;
    if (sent.length && !lineRule) {
      // a packing order: every packed item is its own line
      for (const r of sent) add({ name: r.how, kg: r.weight != null ? Number(r.weight) : null, packs: Number(r.qty_packed), units: Number(r.qty_packed) }, ruleFor(r.how) || all, l.item_id, true);
    } else add({ name, kg: Number(l.qty_net), packs: l.packs_made != null ? Number(l.packs_made) : sent.reduce((a, r) => a + Number(r.qty_packed), 0) || null, units }, lineRule || all, l.item_id, true);
  }
  proc.forEach(g => out.push({ ...g, qty: g.missing ? null : Math.round(g.qty * 1000) / 1000 }));
  return out.map(x => ({ ...x, qty: x.qty == null || isNaN(x.qty) ? '' : qf(Math.round(Number(x.qty) * 1000) / 1000) }));
}

/* ================= ADMIN: staff ================= */
const GROUPS = { admin: 'Admin – sees everything', processing: 'Processing – prepares orders, no prices', invoicing: 'Invoicing – prices & invoices' };
async function staffScreen() {
  const people = await q(sb.from('ord_users').select('*').order('role').order('name'));
  const gsel = (v, attrs) => `<select ${attrs}>${Object.entries(GROUPS).map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const mine = p => p.email === me.toLowerCase();
  V().innerHTML = `<div class="card"><h2>Staff</h2>
    <table><thead><tr><th>Name</th><th>Username</th><th>Group</th><th></th></tr></thead><tbody>${people.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(uname(p.email))}</td>
      <td>${mine(p) ? GROUPS[p.role] : gsel(p.role, `data-role="${esc(p.email)}"`)}</td>
      <td class="num">${mine(p) ? '<span class="muted">you</span>' : `<button class="link" data-pw="${esc(p.email)}">Reset password</button><button class="link" data-rm="${esc(p.email)}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>Add a person</h2>
    <div class="row"><div><label>Name</label><input id="p-name"></div><div><label>Username</label><input id="p-email" autocapitalize="none" spellcheck="false" placeholder="e.g. moshe"></div>
      <div><label>Password</label><input id="p-pass" placeholder="at least 6 characters"></div><div><label>Group</label>${gsel('processing', 'id="p-role"')}</div></div>
    <p class="muted">They sign in with the username and password. They can change the password with the “Password” link at the top, or you can reset it here.</p>
    <div class="actions"><button class="big" id="p-add">Add person</button></div></div>`;
  $('#p-add').onclick = () => safe(async () => {
    const u = await q(sb.rpc('ord_add_person', { p_email: $('#p-email').value, p_name: $('#p-name').value, p_password: $('#p-pass').value, p_role: $('#p-role').value }));
    toast('Added – login: ' + u); staffScreen();
  });
  document.querySelectorAll('[data-role]').forEach(s => s.onchange = () => safe(async () => { await q(sb.from('ord_users').update({ role: s.value }).eq('email', s.dataset.role)); toast('Group changed'); }));
  document.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => safe(async () => {
    const pw = prompt('New password for ' + uname(b.dataset.pw) + ' (at least 6 characters):'); if (pw == null) return;
    await q(sb.rpc('ord_set_password', { p_email: b.dataset.pw, p_password: pw })); toast('Password changed');
  }));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => safe(async () => {
    if (!confirm('Remove ' + uname(b.dataset.rm) + '?')) return; await q(sb.from('ord_users').delete().eq('email', b.dataset.rm)); toast('Removed'); staffScreen();
  }));
}

boot();
