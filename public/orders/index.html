<script>
const sb = supabase.createClient('https://bcdibbhmiwccvvmryqze.supabase.co', 'sb_publishable_YAtej3hTvSDPHPLQVYk-Ig_K4rxgiYr',
  { auth: { storageKey: 'emh-orders-auth', persistSession: true, autoRefreshToken: true } });

/* ================= basics ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null || n === '' || isNaN(n) ? '—' : '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qf = n => n == null || n === '' ? '' : String(Math.round(Number(n) * 1000) / 1000);
const U = u => u === 'kg' ? 'kg' : u === 'units' ? 'units' : '';
const per = u => u === 'kg' ? 'kg' : 'unit';
const ukDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const isoDay = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return d.toLocaleDateString('en-CA'); };
const isNum = v => v !== '' && v != null && !isNaN(Number(v));
const ST = { new: 'To prepare', fulfilled: 'Ready to invoice', invoiced: 'Invoiced' };

let customers = [], items = [], me = '', role = '';
const STAFF_DOMAIN = '@staff.emhbutchers.co.uk';
const uname = e => (e || '').endsWith(STAFF_DOMAIN) ? e.slice(0, -STAFF_DOMAIN.length) : (e || '');
const cust = id => customers.find(c => c.id == id);
const item = id => items.find(i => i.id == id);

function toast(text, err) {
  document.querySelectorAll('.msg').forEach(m => m.remove());
  const el = document.createElement('div'); el.className = 'msg' + (err ? ' err' : ''); el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), err ? 6000 : 2200);
}
async function q(p) {
  const { data, error } = await p;
  if (error) { let m = error.message || String(error); if (/row-level security/i.test(m)) m = 'Your login is not allowed to do that.'; throw new Error(m); }
  return data;
}
async function safe(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }
async function loadLists() {
  [customers, items] = await Promise.all([
    q(sb.from('ord_customers').select('*').order('name')),
    q(sb.from('ord_items').select('*').order('name')),
  ]);
}
async function pricesFor(lineIds) {
  const out = {};
  if (role === 'processing') return out;
  for (let i = 0; i < lineIds.length; i += 150) {
    const rows = await q(sb.from('ord_line_prices').select('*').in('line_id', lineIds.slice(i, i + 150)));
    rows.forEach(r => out[r.line_id] = r.price);
  }
  return out;
}

/* ================= type-to-search box ================= */
function combo(el, o) {
  el.classList.add('combo');
  el.innerHTML = `<input autocomplete="off" placeholder="${esc(o.placeholder || 'Type to search…')}"><div class="opts hide"></div>`;
  const inp = el.querySelector('input'), box = el.querySelector('.opts');
  const nameOf = id => (o.list().find(r => r.id == id) || {}).name || '';
  inp.value = nameOf(o.value);
  let shown = [], hi = 0;
  function draw() {
    const t = inp.value.trim().toLowerCase(), words = t.split(/\s+/).filter(Boolean);
    shown = o.list().filter(r => r.active !== false && words.every(w => r.name.toLowerCase().includes(w))).slice(0, 40).map(r => ({ id: r.id, label: r.name }));
    if (o.onAdd && t && !o.list().some(r => r.name.toLowerCase() === t)) shown.push({ add: inp.value.trim(), label: `+ Add “${inp.value.trim()}” as a new ${o.addWord}` });
    hi = Math.min(hi, Math.max(0, shown.length - 1));
    box.innerHTML = shown.length ? shown.map((s, i) => `<div class="opt ${s.add != null ? 'add' : ''} ${i === hi ? 'hi' : ''}" data-i="${i}">${esc(s.label)}</div>`).join('') : `<div class="opt muted">Nothing found${o.addWord === 'item' ? ' – add it in Xero, then Sync in Settings' : ''}</div>`;
    box.classList.remove('hide');
  }
  async function pick(s) {
    if (!s) return;
    box.classList.add('hide');
    if (s.add != null) { const row = await safe(() => o.onAdd(s.add)); if (!row) return; o.value = row.id; inp.value = o.clear ? '' : row.name; o.onPick(row.id); }
    else { o.value = s.id; inp.value = o.clear ? '' : s.label; o.onPick(s.id); }
  }
  inp.onfocus = () => { inp.select(); hi = 0; draw(); };
  inp.oninput = () => { hi = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); const s = shown[hi]; inp.blur(); pick(s); }
    else if (e.key === 'Escape') inp.blur();
  };
  inp.onblur = () => setTimeout(() => { box.classList.add('hide'); inp.value = o.clear ? '' : nameOf(o.value); }, 180);
  box.onmousedown = e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); const s = shown[+d.dataset.i]; inp.blur(); pick(s); } };
  return { focus: () => inp.focus() };
}
async function newCustomer(name) {
  const dup = customers.find(c => c.name.toLowerCase() === name.trim().toLowerCase() && !c.orphaned); if (dup) return dup;
  const row = await q(sb.from('ord_customers').insert({ name }).select().single());
  customers.push(row); customers.sort((a, b) => a.name.localeCompare(b.name)); toast('Customer added'); return row;
}
async function newItem(name) {
  const row = await q(sb.from('ord_items').insert({ name }).select().single());
  items.push(row); items.sort((a, b) => a.name.localeCompare(b.name)); toast('Item added'); return row;
}
const tog = (val, attrs) => `<span class="tog ${val ? '' : 'need'}">${['kg', 'units'].map(u => `<button type="button" ${attrs} data-u="${u}" class="${val === u ? 'on' : ''}">${u === 'kg' ? 'Kilos' : 'Units'}</button>`).join('')}</span>`;

/* ================= login & navigation ================= */
const TABS = {
  admin: [['home', 'Home'], ['proc', 'Processing'], ['inv', 'Invoicing'], ['setup', 'Settings'], ['staff', 'Staff']],
  processing: [['proc', 'Orders to prepare']],
  invoicing: [['inv', 'Invoicing']],
};
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').classList.remove('hide'); $('#top').classList.add('hide'); $('#view').innerHTML = ''; return; }
  me = session.user.email; $('#login').classList.add('hide'); $('#top').classList.remove('hide'); $('#me').textContent = uname(me);
  await safe(async () => {
    role = await q(sb.rpc('ord_role'));
    if (!role) { $('#nav').innerHTML = ''; $('#view').innerHTML = '<div class="card"><h2>Not set up yet</h2><p>Your login works, but an admin has not added you to the orders system yet.</p></div>'; return; }
    $('#nav').innerHTML = TABS[role].map(([k, t]) => `<button data-tab="${k}">${t}</button>`).join('');
    document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
    await loadLists();
    const ts = await q(sb.from('ord_settings').select('*').eq('key', 'tray_kg')); if (ts[0]) TRAY = Number(ts[0].value);
    const want = location.hash.slice(1);
    go(want && allowed(want) ? want : TABS[role][0][0]);
  });
}
const allowed = t => TABS[role]?.some(([k]) => k === t.split('/')[0]) || (role === 'admin' && (t.startsWith('order/') || t === 'new'));
$('#li-go').onclick = () => safe(async () => {
  const u = $('#li-email').value.trim().toLowerCase();
  const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + STAFF_DOMAIN, password: $('#li-pass').value });
  if (error) throw new Error('Wrong username or password'); boot();
});
$('#li-pass').onkeydown = e => { if (e.key === 'Enter') $('#li-go').click(); };
$('#signout').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.hash = ''; role = ''; boot(); };
$('#pw').onclick = e => { e.preventDefault(); safe(async () => {
  const pw = prompt('New password (at least 6 characters):'); if (pw == null) return;
  if (pw.length < 6) throw new Error('At least 6 characters');
  const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw error; toast('Password changed');
}); };
let cur = '';
window.onhashchange = () => { const h = location.hash.slice(1); if (h && h !== cur && allowed(h)) go(h); };
function go(tab) {
  if (!allowed(tab)) return;
  cur = tab; if (location.hash.slice(1) !== tab) location.hash = tab;
  const base = tab.split('/')[0];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === base || (b.dataset.tab === 'home' && (base === 'new' || base === 'order'))));
  clearInterval(P.timer);
  safe(async () => {
    if (base === 'new') return orderScreen(null);
    if (base === 'order') return orderScreen(Number(tab.split('/')[1]));
    if (base === 'proc') return procScreen();
    if (base === 'inv') return invScreen();
    if (base === 'home') return homeScreen();
    if (base === 'setup') return setupScreen();
    if (base === 'staff') return staffScreen();
  });
}

/* ================= ADMIN: enter / edit an order ================= */
let O = null;
async function packingFor(lineIds) {
  const out = {};
  for (let i = 0; i < lineIds.length; i += 150) {
    (await q(sb.from('ord_packing').select('*').in('line_id', lineIds.slice(i, i + 150)).order('position'))).forEach(r => (out[r.line_id] ||= []).push(r));
  }
  return out;
}
async function resaleFor(lineIds) {
  const out = {};
  if (role === 'invoicing') return out;
  for (let i = 0; i < lineIds.length; i += 150) (await q(sb.from('ord_line_resale').select('*').in('line_id', lineIds.slice(i, i + 150)))).forEach(r => out[r.line_id] = r.total);
  return out;
}
async function packResaleFor(packIds) {
  const out = {};
  if (role === 'invoicing' || !packIds.length) return out;
  for (let i = 0; i < packIds.length; i += 150) (await q(sb.from('ord_packing_resale').select('*').in('packing_id', packIds.slice(i, i + 150)))).forEach(r => out[r.packing_id] = r.price);
  return out;
}
let PACK_WORDS = [], PRESETS = [], GK = null, PLISTS = [], LAST_UNIT = {};
async function loadPresets() { try { PRESETS = await q(sb.from('ord_packing_presets').select('*').order('text')); } catch { PRESETS = []; } }
async function loadPLists() { try { PLISTS = await q(sb.from('ord_packing_lists').select('*').order('name')); } catch { PLISTS = []; } }
async function loadPackWords() {
  await loadPresets(); await loadPLists();
  try { const rows = await q(sb.from('ord_packing').select('how').order('id', { ascending: false }).limit(500)); PACK_WORDS = [...new Set([...PRESETS.map(p => p.text), ...rows.map(r => r.how)])].slice(0, 120); } catch { PACK_WORDS = PRESETS.map(p => p.text); }
}
const isPreset = t => PRESETS.some(p => p.text.trim().toLowerCase() === (t || '').trim().toLowerCase());
async function orderScreen(id) {
  if (id) {
    const o = await q(sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)').eq('id', id).single());
    o.lines = o.ord_lines.sort((a, b) => a.position - b.position); delete o.ord_lines;
    o.prices = await pricesFor(o.lines.map(l => l.id));
    const pk = await packingFor(o.lines.map(l => l.id));
    o.resale = await resaleFor(o.lines.map(l => l.id));
    o.packResale = await packResaleFor(Object.values(pk).flat().map(r => r.id));
    o.lines.forEach(l => l.packing = (pk[l.id] || []).map(r => ({ id: r.id, qty_planned: qf(r.qty_planned), how: r.how, qty_packed: r.qty_packed, weight: r.weight, resale: o.packResale[r.id] })));
    // resale prices planned on the order (what the customer sells for) – used to check the labels

function saveOrder() {
  safe(async () => {
    const o = O;
    if (!o.customer_id) throw new Error('Choose a customer');
    if (!o.prep_date || !o.delivery_date) throw new Error('Fill in both dates');
    const lines = o.lines.filter(l => !l.added_by_ops && (l.item_id || isNum(l.qty_ordered)));
    if (!lines.length) throw new Error('Add at least one item');
    for (const l of lines) {
      if (!l.item_id) throw new Error('Choose the item on every line');
      const n = item(l.item_id).name;
      if (!isNum(l.qty_ordered) || Number(l.qty_ordered) <= 0) throw new Error(`Enter a quantity for ${n}`);
      if (!l.unit) throw new Error(`Tap Kilos or Units for ${n}`);
      for (const r of (l.packing || [])) {
        if ((r.how || '').trim() && r.qty_planned !== '' && r.qty_planned != null && !isNum(r.qty_planned)) throw new Error(`Packing for ${n}: "${r.qty_planned}" is not a number`);
        if (!(r.how || '').trim() && isNum(r.qty_planned)) throw new Error(`Packing for ${n}: say how to pack the ${r.qty_planned}`);
        if (o.plan_on && r.rp_price && !isNum(r.rp_price)) throw new Error(`Resale price for ${n} – ${r.how}: "${r.rp_price}" is not a price`);
      }
      if (o.plan_on && !(l.packing || []).length && l.rp_price && !isNum(l.rp_price)) throw new Error(`Resale price for ${n}: "${l.rp_price}" is not a price`);
    }
    const keepOps = o.lines.filter(l => l.added_by_ops);
    const id = await q(sb.rpc('ord_save', { p: { id: o.id, action: 'order', customer_id: o.customer_id, delivery_date: o.delivery_date, prep_date: o.prep_date, notes: o.notes,
      lines: lines.map(l => ({ id: l.id, item_id: l.item_id, qty_ordered: l.qty_ordered, unit: l.unit, removed: !!l.removed, packing: (l.packing || []).filter(r => (r.how || '').trim()).map(r => ({ id: r.id, qty_planned: r.qty_planned, how: r.how })) })), keep_ids: keepOps.map(l => l.id) } }));
    const plan = !o.plan_on ? [] : lines.flatMap(l => (l.packing || []).filter(r => (r.how || '').trim()).length
      ? l.packing.filter(r => (r.how || '').trim() && isNum(r.rp_price)).map(r => ({ item_id: l.item_id, how: r.how.trim(), price: r.rp_price, per: r.rp_per || 'kg' }))
      : isNum(l.rp_price) ? [{ item_id: l.item_id, how: '', price: l.rp_price, per: l.rp_per || 'kg' }] : []);
    if (o.plan_on || o.id) await q(sb.rpc('ord_set_plan_resale', { p_order: o.id || id, p_rows: plan }));
    toast(o.id ? 'Saved' : `Order #${id} saved`);
    go('home');
  });
}

let TRAY = 1.65;
const netOf = l => {
  if (!isNum(l.qty_sent)) return null;
  const t = Number(l.trays || 0), k = Number(l.tray_kg) > 0 ? Number(l.tray_kg) : TRAY;
  return l.sent_unit === 'kg' ? Math.round((Number(l.qty_sent) - t * k) * 1000) / 1000 : Number(l.qty_sent);
};
const P = { day: '', tab: 'todo', timer: null, modal: false };
function itemsShort(o, sent) {

    const qv = sent && l.qty_sent != null ? `${qf(l.qty_net ?? netOf(l))} ${U(l.sent_unit)}` : `${qf(l.qty_ordered)} ${U(l.unit)}`;
    return `${esc(item(l.item_id)?.name)} <b>${qv}</b>`;
  }).join(', ');
}

/* ================= XERO ================= */
let XERO = { connected: false };
async function xeroCall(body) {
  const { data, error } = await sb.functions.invoke('xero', { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function xeroStatus() { try { XERO = await xeroCall({ action: 'status' }); } catch { XERO = { connected: false }; } return XERO; }

/* ================= INVOICING ================= */
const I = { tab: 'todo' };
async function invScreen() {

  qy = I.tab === 'done' ? qy.order('invoiced_at', { ascending: false }).limit(200) : qy.order(I.tab === 'waiting' ? 'prep_date' : 'delivery_date').order('id');
  const [orders, cnt] = await Promise.all([q(qy), q(sb.from('ord_orders').select('status').in('status', ['fulfilled', 'new']))]);
  orders.forEach(o => { o.lines = o.ord_lines.filter(l => !l.removed).sort((a, b) => a.position - b.position); delete o.ord_lines; });
  const ids = orders.flatMap(o => o.lines.map(l => l.id));
  const [prices, pk, ils, rl] = I.tab === 'waiting' ? [{}, {}, [], []] : await Promise.all([pricesFor(ids), packingFor(ids),
    orders.length ? q(sb.from('ord_invoice_lines').select('order_id, qty, price').in('order_id', orders.map(o => o.id))) : [], q(sb.from('ord_price_rules').select('customer_id'))]);
  orders.forEach(o => o.lines.forEach(l => { l.price = prices[l.id] ?? ''; l.pack = pk[l.id] || []; }));
  const ruled = new Set(rl.map(r => r.customer_id));
  const lt = l => isNum(l.price) && l.qty_net != null ? Math.round(Number(l.qty_net) * Number(l.price) * 100) / 100 : null;
  const ilOf = o => ils.filter(x => x.order_id === o.id);
  const tot = o => ilOf(o).length ? ilOf(o).reduce((s, x) => s + (x.qty != null && x.price != null ? Math.round(x.qty * x.price * 100) / 100 : 0), 0) : o.lines.reduce((s, l) => s + (lt(l) ?? 0), 0);
  const missing = o => ilOf(o).length ? ilOf(o).some(x => x.price == null || x.qty == null) : ruled.has(o.customer_id) ? false : o.lines.some(l => !isNum(l.price));
  const nTodo = cnt.filter(c => c.status === 'fulfilled').length, nWait = cnt.filter(c => c.status === 'new').length;
  const today = isoDay(0);
  const dateOf = o => I.tab === 'done' ? (o.invoiced_at || '').slice(0, 10) : I.tab === 'waiting' ? o.prep_date : o.delivery_date;
  const groups = []; orders.forEach(o => { const k = dateOf(o); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, list: [] }); g.list.push(o); });
  const gname = k => (k === today ? 'Today · ' : k === isoDay(-1) ? 'Yesterday · ' : k === isoDay(1) ? 'Tomorrow · ' : '') + ukDate(k);

    if (I.tab === 'waiting') return `<div class="pcard flat"><div class="pcn">${esc(cust(o.customer_id)?.name)}</div><div class="pci">${itemsShort(o, false)}</div></div>`;
    const t = tot(o);
    return `<button class="pcard icard" data-o="${o.id}"><div class="icl"><div class="pcn">${esc(cust(o.customer_id)?.name)}${I.tab === 'todo' && missing(o) ? ' <span class="tg tg-ed">prices needed</span>' : ''}${I.tab === 'todo' && ruled.has(o.customer_id) && !ilOf(o).length ? ' <span class="tg tg-ok">price list</span>' : ''}</div>
      <div class="pci">#${o.id} · ${o.lines.length} item${o.lines.length === 1 ? '' : 's'}${o.invoice_number ? ' · ' + esc(o.invoice_number) : ''}</div></div><div class="icr">${t ? money(t) : '—'}</div></button>`;
  };
  $('#view').innerHTML = `
    <div class="ptop"><div class="seg">
      <button data-t="todo" class="${I.tab === 'todo' ? 'on' : ''}">To invoice${nTodo ? ` (${nTodo})` : ''}</button>
      <button data-t="done" class="${I.tab === 'done' ? 'on' : ''}">Invoiced</button>
      <button data-t="waiting" class="${I.tab === 'waiting' ? 'on' : ''}">Not prepared yet${nWait ? ` (${nWait})` : ''}</button></div></div>
    ${groups.length ? groups.map(g => `<section class="pday"><div class="pdh"><span class="pdn" style="font-size:19px">${I.tab === 'done' ? 'Invoiced ' : I.tab === 'waiting' ? 'Prepare ' : 'Delivered '}${gname(g.k)}</span></div>

const H = { f: 'open', search: '' };
function taskModal(kind, t) {

    <div class="mh"><div class="mt">${t ? 'Edit ' + label.toLowerCase() : 'New ' + label.toLowerCase()}</div><button class="mx" aria-label="Close">✕</button></div>

    <div class="mf">${t ? '<button class="mbtn ghost" data-del style="margin-right:auto;color:#b3261e">Delete</button>' : ''}<button class="mbtn ghost" data-c>Cancel</button><button class="mbtn go" data-s>Save</button></div>`);

    const text = inp.value.trim(), due_date = m.querySelector('#tk-date').value;

    if (t) await q(sb.from('ord_tasks').update({ text, due_date }).eq('id', t.id));

  });
  inp.onkeydown = e => { if (e.key === 'Enter') save(); };

  if (t) m.querySelector('[data-del]').onclick = () => safe(async () => { if (!confirm(`Delete this ${label.toLowerCase()}?`)) return; await q(sb.from('ord_tasks').delete().eq('id', t.id)); close(); toast('Deleted'); homeScreen(); });
}
async function homeScreen() {
  const today = isoDay(0), midnight = new Date(today + 'T00:00:00').toISOString().replace(/\.\d+Z$/, 'Z');
  let qy = sb.from('ord_orders').select('*, ord_lines!ord_lines_order_id_fkey(*)');
  qy = H.f === 'open' ? qy.neq('status', 'invoiced').order('prep_date').order('id') : qy.eq('status', 'invoiced').order('invoiced_at', { ascending: false }).limit(150);
  const [orders, counts, tasks] = await Promise.all([
    q(qy),
    q(sb.from('ord_orders').select('status').neq('status', 'invoiced')),
    q(sb.from('ord_tasks').select('*').or(`done.eq.false,done_at.gte.${midnight}`).order('due_date').order('created_at')),
  ]);
  orders.forEach(o => { o.lines = o.ord_lines.filter(l => !l.removed).sort((a, b) => a.position - b.position); delete o.ord_lines; });
  const prices = await pricesFor(orders.flatMap(o => o.lines.map(l => l.id)));
  const n = s => counts.filter(c => c.status === s).length;
  const openT = k => tasks.filter(t => t.kind === k && !t.done).length;
  const term = H.search.trim().toLowerCase();
  const shown = orders.filter(o => !term || (cust(o.customer_id)?.name || '').toLowerCase().includes(term));
  const gk = o => H.f === 'open' ? (o.prep_date < today ? 'late' : o.prep_date) : (o.invoiced_at || '').slice(0, 10);
  const groups = []; shown.forEach(o => { const k = gk(o); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, list: [] }); g.list.push(o); });
  const gname = k => k === 'late' ? 'Late – should have been prepared already' : (k === today ? 'Today · ' : k === isoDay(1) ? 'Tomorrow · ' : '') + ukDate(k);
  const total = o => o.lines.reduce((s, l) => s + (prices[l.id] != null && l.qty_net != null ? Number(l.qty_net) * prices[l.id] : 0), 0);
  const tasksBy = kind => { const L = tasks.filter(t => t.kind === kind); if (!L.length) return '<div class="pempty">Nothing</div>';
    return L.map(t => `<div class="hrow t ${t.done ? 'done' : ''}" data-t="${t.id}"><span class="hd ${t.due_date < today && !t.done ? 'late-t' : ''}">${t.due_date === today ? 'Today' : ukDate(t.due_date)}</span><span>${t.done ? '✓ ' : ''}${esc(t.text)}</span></div>`).join(''); };
  $('#view').innerHTML = `
    <div class="hbtns"><button class="big" id="h-new">+ New order</button><button class="btn" id="h-prep">+ Preparation task</button><button class="btn" id="h-shop">+ Shop order</button></div>
    <div class="hstats">
      <div><span>To prepare</span><b>${n('new')}</b></div><div><span>Ready to invoice</span><b>${n('fulfilled')}</b></div>
      <div><span>Open tasks</span><b>${openT('prep')}</b></div><div><span>Open shop orders</span><b>${openT('shop')}</b></div>
    </div>
    <div class="card">
      <div class="hhead"><h2>Orders</h2>
        <div class="seg sm"><button data-f="open" class="${H.f === 'open' ? 'on' : ''}">Not invoiced</button><button data-f="inv" class="${H.f === 'inv' ? 'on' : ''}">Invoiced</button></div>
        <input id="h-search" placeholder="Search customer" value="${esc(H.search)}"></div>
      ${groups.length ? groups.map(g => `<div class="hgrp ${g.k === 'late' ? 'late-t' : ''}">${H.f === 'open' ? gname(g.k) : 'Invoiced ' + ukDate(g.k)}</div>` + g.list.map(o => `
        <div class="hrow o" data-o="${o.id}"><span class="muted">#${o.id}</span><span><b>${esc(cust(o.customer_id)?.name)}</b><div class="muted hit">${itemsShort(o, o.status !== 'new')}</div></span>
          <span class="num">${total(o) ? money(total(o)) : '—'}</span><span><span class="badge s-${o.status}">${ST[o.status]}</span>${o.invoice_number ? `<div class="muted">${esc(o.invoice_number)}</div>` : ''}</span></div>`).join('')).join('')
        : `<div class="pempty">${term ? 'No orders for that customer' : 'No orders'}</div>`}
    </div>
    <div class="row" style="align-items:flex-start">
      <div class="card"><h2>Preparation tasks</h2>${tasksBy('prep')}</div>
      <div class="card"><h2>Shop orders</h2>${tasksBy('shop')}</div>
    </div>`;

  $('#h-shop').onclick = () => taskModal('shop');
  document.querySelectorAll('.hhead [data-f]').forEach(b => b.onclick = () => { H.f = b.dataset.f; homeScreen(); });
  const si = $('#h-search'); si.oninput = () => { H.search = si.value; clearTimeout(si._t); si._t = setTimeout(() => { homeScreen().then(() => { const x = $('#h-search'); x.focus(); x.setSelectionRange(x.value.length, x.value.length); }); }, 250); };
  document.querySelectorAll('.hrow.o').forEach(r => r.onclick = () => go('order/' + r.dataset.o));

    : `<p>Not connected. Click below and approve in Xero – you’ll come straight back here.</p>${XERO.client_hint ? `<p class="muted">Client ID in use: <b>${esc(XERO.client_hint)}</b> – it should match the Client ID on your Xero app page (32 characters).</p>` : ''}<div class="actions"><button class="big blue" id="x-con">Connect Xero</button></div>`}</div>
    <div class="card"><h2>Reading labels (Gemini)</h2>
      <p class="muted">Lets processing photograph the subtotal labels instead of typing the figures. The key is stored privately – nobody can see it again after saving.</p>
      <p id="s-gk">${GK?.set ? `<b class="ok-t">✓ Key saved</b> <span class="muted">${new Date(GK.set_at).toLocaleDateString('en-GB')} by ${esc(uname(GK.set_by))}</span>` : '<b>No key saved yet</b>'}</p>
      <div class="row"><input id="s-gkin" type="password" autocomplete="off" placeholder="Paste the Gemini API key"><button class="btn blue" style="flex:none" id="s-gksave">Save key</button>${GK?.set ? '<button class="btn" style="flex:none" id="s-gkdel">Remove</button>' : ''}</div></div>
    <div class="card"><h2>Saved packing lists</h2>
      <p class="muted">Whole packing lists you can pick in one go when entering an order. Save one from an order with “Save this list”.</p>
      ${PLISTS.length ? `<table><tbody>${PLISTS.map(p => `<tr><td><b>${esc(p.name)}</b><div class="muted" style="font-size:13px">${p.rows.map(r => (r.qty != null ? qf(r.qty) + ' × ' : '') + esc(r.how)).join(', ')}</div></td><td style="text-align:right"><button class="link" data-pldel="${p.id}">Remove</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">None saved yet</p>'}</div>
    <div class="card"><h2>Packing options</h2>
      <p class="muted">Saved ways of packing. They show as quick buttons under the packing list when creating an order.</p>
      <div class="pkchips" id="s-pp">${PRESETS.map(p => `<span class="pkchip">${esc(p.text)} <button class="link" data-pp="${p.id}" aria-label="Remove">✕</button></span>`).join('') || '<span class="muted">None saved yet</span>'}</div>
      <div class="row" style="margin-top:10px"><input id="s-ppin" placeholder="e.g. Whole, 2 per tray"><button class="btn blue" style="flex:none" id="s-ppadd">+ Add</button></div></div>
    <div class="card"><h2>Tray weight</h2>
    <div class="row" style="align-items:center"><div style="flex:none"><input id="s-tray" inputmode="decimal" style="width:120px;text-align:right" value="${TRAY}"></div><div style="flex:none">kg per tray</div>
    <div style="flex:none"><button class="btn blue" id="s-tsave">Save</button></div>
    <div class="muted">Processing enters how many trays; this weight × trays is taken off the weight. Changing it only affects weights entered from now on.</div></div></div>
    <div class="row" style="align-items:flex-start">
    <div class="card"><h2>Customers <span class="muted">${nC}</span></h2><div class="row"><input id="s-fc" placeholder="Search…"><button class="btn" style="flex:none" id="s-ac">+ New customer</button></div>
      <p class="muted">New customers added here are created in Xero automatically when their first invoice is sent.</p>
      <div style="max-height:520px;overflow:auto"><table><tbody id="s-tc">${list(customers, 'c')}</tbody></table></div></div>
    <div class="card"><h2>Items <span class="muted">${nI}</span></h2><div class="row"><input id="s-fi" placeholder="Search…"></div>
      <p class="muted">Add new items in Xero, then press Sync.</p>
      <div style="max-height:520px;overflow:auto"><table><tbody id="s-ti">${list(items, 'i')}</tbody></table></div></div></div>`;
  $('#x-con').onclick = () => safe(async () => { const r = await xeroCall({ action: 'auth_url' }); location.href = r.url; });
  if ($('#x-dis')) $('#x-dis').onclick = () => safe(async () => { if (!confirm('Disconnect Xero?')) return; await xeroCall({ action: 'disconnect' }); setupScreen(); });
  if ($('#x-sync')) $('#x-sync').onclick = e => safe(async () => {
    const b = e.target; b.disabled = true; b.textContent = 'Syncing…';
    try { const r = await xeroCall({ action: 'sync' }); toast(`Synced: ${r.customers_added} new customers, ${r.items_added} new items`); await setupScreen(); }
    finally { b.disabled = false; b.textContent = '↻ Sync with Xero'; }
  });
  const addPP = () => safe(async () => { const t = $('#s-ppin').value.trim(); if (!t) throw new Error('Type the packing option first'); if (isPreset(t)) throw new Error('Already saved');
    await q(sb.from('ord_packing_presets').insert({ text: t })); toast('Saved'); setupScreen(); });
  $('#s-ppadd').onclick = addPP;
  document.querySelectorAll('[data-pldel]').forEach(b => b.onclick = () => safe(async () => { if (!confirm('Remove this saved list?')) return; await q(sb.from('ord_packing_lists').delete().eq('id', b.dataset.pldel)); setupScreen(); }));
  $('#s-gksave').onclick = () => safe(async () => { const v = $('#s-gkin').value.trim(); if (v.length < 20) throw new Error('Paste the whole key first');
    await q(sb.rpc('ord_set_secret', { p_key: 'gemini_api_key', p_value: v })); toast('Key saved'); setupScreen(); });
  if ($('#s-gkdel')) $('#s-gkdel').onclick = () => safe(async () => { if (!confirm('Remove the Gemini key? Photo labels will stop working.')) return;
    await q(sb.rpc('ord_set_secret', { p_key: 'gemini_api_key', p_value: '' })); setupScreen(); }); $('#s-ppin').onkeydown = e => { if (e.key === 'Enter') addPP(); };
  document.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => safe(async () => { await q(sb.from('ord_packing_presets').delete().eq('id', b.dataset.pp)); setupScreen(); }));
  $('#s-tsave').onclick = () => safe(async () => {
    const v = $('#s-tray').value.trim(); if (!isNum(v) || Number(v) < 0) throw new Error('Enter the tray weight in kg, e.g. 1.65');
    await q(sb.from('ord_settings').update({ value: String(Number(v)) }).eq('key', 'tray_kg')); TRAY = Number(v); toast('Tray weight saved');
  });
  const filt = (inp, tb) => inp.oninput = () => { const t = inp.value.trim().toLowerCase(); tb.querySelectorAll('tr').forEach(r => r.style.display = r.dataset.name.includes(t) ? '' : 'none'); };
  filt($('#s-fc'), $('#s-tc')); filt($('#s-fi'), $('#s-ti'));
  document.querySelectorAll('[data-prl]').forEach(b => b.onclick = () => safe(() => priceListModal(Number(b.dataset.prl))));
  $('#s-ac').onclick = () => safe(async () => {
    const n = (prompt('New customer name (as it should appear in Xero):', $('#s-fc').value.trim()) || '').trim(); if (!n) return;
    const dup = customers.find(c => c.name.toLowerCase() === n.toLowerCase()); if (dup) throw new Error(`"${dup.name}" already exists`);
    await newCustomer(n); setupScreen();
  });
}

/* Customer price list: a row for all items and/or rows for one item (or packed item). Blank price = not charged. */
const PER = { kg: 'per kg', pack: 'per packet', unit: 'per unit/chicken' };
async function priceListModal(cid) {
  const c = cust(cid);
  let rows = (await q(sb.from('ord_price_rules').select('*').eq('customer_id', cid).order('position'))).map(r => ({ ...r, meat_price: r.meat_price != null ? qf(r.meat_price) : '', proc_price: r.proc_price != null ? qf(r.proc_price) : '' }));
  if (!rows.length) rows = [{ applies_to: '', meat_price: '', meat_per: 'kg', proc_price: '', proc_per: 'kg' }];
  await loadPackWords();
  const names = [...new Set([...items.filter(i => !i.orphaned).map(i => i.name), ...PACK_WORDS])].sort();
  const perSel = (v, a) => `<select ${a}>${Object.entries(PER).map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const { m, close } = modal(`
    <div class="mh"><div><div class="mt">Price list – ${esc(c?.name)}</div><div class="ms">Invoices for this customer are worked out from this. Leave a price empty if it isn’t charged.</div></div><button class="mx" aria-label="Close">✕</button></div>
    <datalist id="pl-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="prh"><span>Applies to</span><span>Meat £</span><span></span><span>Processing £</span><span></span><span></span></div>
    <div data-rows></div>
    <button class="link" data-add>+ Add a row for one item</button>
    <p class="muted" style="font-size:13px;margin-top:10px">A row for one item (e.g. “Minced Beef” or “Chicken”) replaces the prices it fills in; anything left empty comes from the “All items” row. Put 0 for “not charged”. Item names match the packing lines or the item on the order.</p>
    <div class="mf"><button class="mbtn ghost" data-c>Cancel</button><button class="mbtn go" data-s>Save price list</button></div>`);
  m.querySelector('.mbox').classList.add('wide');
  const box = m.querySelector('[data-rows]');
  const draw = () => {
    box.innerHTML = rows.map((r, i) => `<div class="prr">
      <input data-f="applies_to" data-i="${i}" list="pl-names" placeholder="All items" value="${esc(r.applies_to)}">
      <input data-f="meat_price" data-i="${i}" inputmode="decimal" placeholder="—" value="${esc(r.meat_price)}">${perSel(r.meat_per, `data-f="meat_per" data-i="${i}"`)}
      <input data-f="proc_price" data-i="${i}" inputmode="decimal" placeholder="—" value="${esc(r.proc_price)}">${perSel(r.proc_per, `data-f="proc_per" data-i="${i}"`)}
      <button class="link" data-x="${i}" aria-label="Remove row">✕</button></div>`).join('');
    box.querySelectorAll('[data-f]').forEach(e => e[e.tagName === 'SELECT' ? 'onchange' : 'oninput'] = () => rows[e.dataset.i][e.dataset.f] = e.value.trim());
    box.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.x, 1); draw(); });
  };
  draw();
  m.querySelector('[data-add]').onclick = () => { rows.push({ applies_to: '', meat_price: '', meat_per: 'kg', proc_price: '', proc_per: 'kg' }); draw(); box.querySelectorAll('[data-f="applies_to"]')[rows.length - 1].focus(); };
  m.querySelector('.mx').onclick = close; m.querySelector('[data-c]').onclick = close;
  m.querySelector('[data-s]').onclick = () => safe(async () => {
    const keep = rows.filter(r => r.applies_to || r.meat_price || r.proc_price);
    const seen = new Set();
    for (const r of keep) {
      const k = r.applies_to.toLowerCase(); if (seen.has(k)) throw new Error(`“${r.applies_to || 'All items'}” is in the list twice`); seen.add(k);
      for (const f of ['meat_price', 'proc_price']) if (r[f] && !isNum(r[f])) throw new Error(`“${r[f]}” is not a price (${r.applies_to || 'All items'})`);
      if (!r.meat_price && !r.proc_price) throw new Error(`${r.applies_to || 'All items'}: fill in a meat or processing price`);
    }
    await q(sb.from('ord_price_rules').delete().eq('customer_id', cid));
    if (keep.length) await q(sb.from('ord_price_rules').insert(keep.map((r, i) => ({ customer_id: cid, applies_to: r.applies_to, meat_price: r.meat_price || null, meat_per: r.meat_per, proc_price: r.proc_price || null, proc_per: r.proc_per, position: i }))));
    close(); toast('Price list saved'); setupScreen();
  });
}

/* Work out invoice lines from the customer's price list and what processing sent */
const nm = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function workOutInvoice(o, rules) {
  const all = rules.find(r => !r.applies_to.trim());
  const own = name => rules.find(r => r.applies_to.trim() && nm(r.applies_to) === nm(name));
  // an item's own row only replaces the prices it fills in; empty ones come from the "All items" row
  const ruleFor = name => { const r = own(name); if (!r) return null; if (!all) return r;
    return { ...r, meat_price: r.meat_price ?? all.meat_price, meat_per: r.meat_price != null ? r.meat_per : all.meat_per, proc_price: r.proc_price ?? all.proc_price, proc_per: r.proc_price != null ? r.proc_per : all.proc_per }; };
  const out = [], proc = new Map();
  const qtyOf = (t, per) => per === 'kg' ? t.kg : per === 'pack' ? t.packs : t.units;
  const add = (t, r, itemId, both) => {
    if (!r) { out.push({ item_id: itemId, description: t.name, qty: t.kg, unit: 'kg', price: '', kind: 'meat', why: 'no price in the price list' }); return; }
    if (r.meat_price != null && Number(r.meat_price) > 0) out.push({ item_id: itemId, description: both && Number(r.proc_price) > 0 ? `${t.name} – meat` : t.name, qty: qtyOf(t, r.meat_per), unit: r.meat_per, price: qf(r.meat_price), kind: 'meat' });
    if (r.proc_price != null && Number(r.proc_price) > 0) {
      const k = `${itemId}|${r.proc_price}|${r.proc_per}`;
      const g = proc.get(k) || { item_id: itemId, description: 'Processing', qty: 0, unit: r.proc_per, price: qf(r.proc_price), kind: 'proc', missing: false };
      const qn = qtyOf(t, r.proc_per); if (qn == null) g.missing = true; else g.qty += Number(qn);
      proc.set(k, g);
    }
  };
  for (const l of o.lines) {
    if (l.removed || l.qty_net == null) continue;
    const name = item(l.item_id)?.name || '';
    const units = l.packs_made != null ? Number(l.packs_made) : l.unit === 'units' && !l.added_by_ops ? Number(l.qty_ordered) : null;
    const sent = (l.pack || []).filter(r => Number(r.qty_packed) > 0);
    const lineRule = own(name) ? ruleFor(name) : null;
    if (sent.length && !lineRule) {
      // a packing order: every packed item is its own line
      for (const r of sent) add({ name: r.how, kg: r.weight != null ? Number(r.weight) : null, packs: Number(r.qty_packed), units: Number(r.qty_packed) }, ruleFor(r.how) || all, l.item_id, true);
    } else add({ name, kg: Number(l.qty_net), packs: l.packs_made != null ? Number(l.packs_made) : sent.reduce((a, r) => a + Number(r.qty_packed), 0) || null, units }, lineRule || all, l.item_id, true);
  }
  proc.forEach(g => out.push({ ...g, qty: g.missing ? null : Math.round(g.qty * 1000) / 1000 }));
  return out.map(x => ({ ...x, qty: x.qty == null || isNaN(x.qty) ? '' : qf(Math.round(Number(x.qty) * 1000) / 1000) }));
}

/* ================= ADMIN: staff ================= */
const GROUPS = { admin: 'Admin – sees everything', processing: 'Processing – prepares orders, no prices', invoicing: 'Invoicing – prices & invoices' };
async function staffScreen() {
  const people = await q(sb.from('ord_users').select('*').order('role').order('name'));
  const gsel = (v, attrs) => `<select ${attrs}>${Object.entries(GROUPS).map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const mine = p => p.email === me.toLowerCase();
  $('#view').innerHTML = `<div class="card"><h2>Staff</h2>
    <table><thead><tr><th>Name</th><th>Username</th><th>Group</th><th></th></tr></thead><tbody>${people.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(uname(p.email))}</td>
      <td>${mine(p) ? GROUPS[p.role] : gsel(p.role, `data-role="${esc(p.email)}"`)}</td>
      <td class="num">${mine(p) ? '<span class="muted">you</span>' : `<button class="link" data-pw="${esc(p.email)}">Reset password</button><button class="link" data-rm="${esc(p.email)}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>Add a person</h2>
    <div class="row"><div><label>Name</label><input id="p-name"></div><div><label>Username</label><input id="p-email" autocapitalize="none" spellcheck="false" placeholder="e.g. moshe"></div>
      <div><label>Password</label><input id="p-pass" placeholder="at least 6 characters"></div><div><label>Group</label>${gsel('processing', 'id="p-role"')}</div></div>
    <p class="muted">They sign in with the username and password. They can change the password with the “Password” link at the top, or you can reset it here.</p>
    <div class="actions"><button class="big" id="p-add">Add person</button></div></div>`;
  $('#p-add').onclick = () => safe(async () => {
    const u = await q(sb.rpc('ord_add_person', { p_email: $('#p-email').value, p_name: $('#p-name').value, p_password: $('#p-pass').value, p_role: $('#p-role').value }));
    toast('Added – login: ' + u); staffScreen();
  });
  document.querySelectorAll('[data-role]').forEach(s => s.onchange = () => safe(async () => { await q(sb.from('ord_users').update({ role: s.value }).eq('email', s.dataset.role)); toast('Group changed'); }));
  document.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => safe(async () => {
    const pw = prompt('New password for ' + uname(b.dataset.pw) + ' (at least 6 characters):'); if (pw == null) return;
    await q(sb.rpc('ord_set_password', { p_email: b.dataset.pw, p_password: pw })); toast('Password changed');
  }));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => safe(async () => {
    if (!confirm('Remove ' + uname(b.dataset.rm) + '?')) return; await q(sb.from('ord_users').delete().eq('email', b.dataset.rm)); toast('Removed'); staffScreen();
  }));
}

boot();
