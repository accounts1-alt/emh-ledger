name: Nightly pull and morning report

on:
  schedule:
    # 04:47 UTC every day = 04:47 in winter, 05:47 in summer (UK). GitHub can start it up to ~30 min late.
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'both = download then email, pull = download only, report = email only, semtek-discover = list the Semtek database tables'
        default: both
        type: choice
        options: [both, pull, report, semtek-discover]
      day:
        description: 'Report on this day (YYYY-MM-DD). Leave blank for yesterday.'
        required: false

concurrency: nightly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_ZEROTIER: ${{ secrets.ZEROTIER_NETWORK_ID != '' && secrets.ZEROTIER_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # joins the shop's ZeroTier network for this run only (removed again when the run ends)
      - name: Join ZeroTier
        if: env.HAS_ZEROTIER == 'true'
        uses: zerotier/github-action@v1
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          auth_token: ${{ secrets.ZEROTIER_API_TOKEN }}
      - run: npx tsx automation/run.ts ${{ inputs.what || 'both' }}
        env:
          REPORT_DAY: ${{ inputs.day }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STRIPE_SHOP_KEY: ${{ secrets.STRIPE_SHOP_KEY }}
          STRIPE_OFFICE_KEY: ${{ secrets.STRIPE_OFFICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SEMTEK_SQL_HOST: ${{ secrets.SEMTEK_SQL_HOST }}
          SEMTEK_SQL_PORT: ${{ secrets.SEMTEK_SQL_PORT }}
          SEMTEK_SQL_DB: ${{ secrets.SEMTEK_SQL_DB }}
          SEMTEK_SQL_USER: ${{ secrets.SEMTEK_SQL_USER }}
          SEMTEK_SQL_PASS: ${{ secrets.SEMTEK_SQL_PASS }}
