name: Publish the app (GitHub Pages)

# Builds the app and publishes it to https://accounts1-alt.github.io/emh-ledger/ on every change to main.
# Free and unlimited; nothing to top up.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -- --base=/emh-ledger/
      # The Semtek Portal is its own self-contained app; it ships to /emh-ledger/portal/
      - name: Build the portal
        working-directory: portal
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/emh-ledger/portal/ --outDir ../dist/portal --emptyOutDir
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub sometimes can't see the just-uploaded artifact yet; a short pause avoids "No artifacts named github-pages"
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
