name: Deploy the app to Netlify

# Publishes the current code to cash-ledger-emh.netlify.app.
# Run from Actions; the one-time proxy path (which authorises the deploy) is passed in when dispatched.

on:
  workflow_dispatch:
    inputs:
      proxy_path:
        description: 'Netlify deploy proxy path'
        required: true

concurrency: deploy-netlify

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx -y @netlify/mcp@latest --site-id e5bebdf3-377d-4089-aa8e-21bb55898931 --proxy-path "${{ inputs.proxy_path }}"
