name: Deploy the app to Netlify

# Builds the site and publishes it to cash-ledger-emh.netlify.app on every change to main.
# Needs one secret: NETLIFY_AUTH_TOKEN (a Netlify personal access token).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-netlify

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish to Netlify
        run: npx --yes netlify-cli@17.38.1 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message "GitHub Actions ${GITHUB_SHA}"
        env:
          NETLIFY_SITE_ID: e5bebdf3-377d-4089-aa8e-21bb55898931
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
